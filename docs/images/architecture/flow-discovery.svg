<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="660" viewBox="0 0 1760 660" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="discTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="discArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .laneA { fill: #0b1020; }
      .laneB { fill: #070c1a; }
      .lane  { stroke: #151d31; stroke-width: 1; }
      .lnm   { font-size: 13px; font-weight: 700; fill: #e2e8f0; }
      .snm   { font-size: 12px; font-weight: 700; }
      .snote { font-size: 10px; fill: #94a3b8; }
      .num   { font-size: 10.5px; font-weight: 800; fill: #050813; }
      .link  { fill: none; stroke: #64748b; stroke-width: 1.75; }
    </style>
  </defs>

  <rect width="1760" height="660" fill="#050813"/>

  <text x="60" y="54" font-size="15" font-weight="600" fill="#fb923c" letter-spacing="3">DYNAMIC VIEW &#183; 02</text>
  <text x="60" y="96" font-size="30" font-weight="800" fill="#f1f5f9">Finding APIs already running. <tspan fill="url(#discTitle)">The flow that starts elsewhere.</tspan></text>
  <text x="60" y="132" font-size="13.5" fill="#64748b">The only flow that begins outside APIHUB &#8212; in someone else&#8217;s Kubernetes cluster, where the agent lives.</text>

  <!-- ===== LANES ===== -->
  <rect x="60" y="160" width="1640" height="96" rx="10" class="laneA lane"/>
  <rect x="60" y="264" width="1640" height="96" rx="10" class="laneB lane"/>
  <rect x="60" y="368" width="1640" height="96" rx="10" class="laneA lane"/>
  <rect x="60" y="472" width="1640" height="96" rx="10" class="laneB lane"/>

  <rect x="60" y="184" width="4" height="48" rx="2" fill="#38bdf8"/>
  <text x="84" y="207" class="lnm">User /</text>
  <text x="84" y="224" class="lnm">Agents SPA</text>
  <rect x="60" y="288" width="4" height="48" rx="2" fill="#10b981"/>
  <text x="84" y="317" class="lnm">Agents Backend</text>
  <rect x="60" y="392" width="4" height="48" rx="2" fill="#fb923c"/>
  <text x="84" y="421" class="lnm">Agent</text>
  <rect x="60" y="496" width="4" height="48" rx="2" fill="#94a3b8"/>
  <text x="84" y="525" class="lnm">Cluster services</text>

  <!-- ===== CONNECTORS ===== -->
  <path d="M 456 416 H 468 V 208 H 474" class="link" marker-end="url(#discArrow)"/>
  <path d="M 656 208 H 668 V 312 H 674" class="link" marker-end="url(#discArrow)"/>
  <path d="M 856 312 H 868 V 520 H 874" class="link" marker-end="url(#discArrow)"/>
  <path d="M 1056 520 H 1074" class="link" marker-end="url(#discArrow)"/>
  <path d="M 1256 520 H 1268 V 312 H 1274" class="link" marker-end="url(#discArrow)"/>
  <path d="M 1456 312 H 1474" class="link" marker-end="url(#discArrow)"/>

  <!-- ===== STEPS ===== -->
  <!-- 1: Agent -->
  <rect x="280" y="378" width="176" height="76" rx="10" fill="#fb923c" fill-opacity="0.16" stroke="#fb923c" stroke-opacity="0.6"/>
  <circle cx="296" cy="394" r="10" fill="#fb923c"/>
  <text x="296" y="398" class="num" text-anchor="middle">1</text>
  <text x="314" y="399" class="snm" fill="#fdba74">Register</text>
  <text x="294" y="426" class="snote">On startup, then a</text>
  <text x="294" y="440" class="snote">heartbeat every ~30 s</text>

  <!-- 2: User -->
  <rect x="480" y="170" width="176" height="76" rx="10" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.6"/>
  <circle cx="496" cy="186" r="10" fill="#38bdf8"/>
  <text x="496" y="190" class="num" text-anchor="middle">2</text>
  <text x="514" y="191" class="snm" fill="#7dd3fc">Run discovery</text>
  <text x="494" y="218" class="snote">Pick a namespace and</text>
  <text x="494" y="232" class="snote">a target workspace</text>

  <!-- 3: Agents Backend -->
  <rect x="680" y="274" width="176" height="76" rx="10" fill="#10b981" fill-opacity="0.16" stroke="#10b981" stroke-opacity="0.6"/>
  <circle cx="696" cy="290" r="10" fill="#10b981"/>
  <text x="696" y="294" class="num" text-anchor="middle">3</text>
  <text x="714" y="295" class="snm" fill="#6ee7b7">Forward request</text>
  <text x="694" y="322" class="snote">Routed to the agent</text>
  <text x="694" y="336" class="snote">registered for that cluster</text>

  <!-- 4: Cluster -->
  <rect x="880" y="482" width="176" height="76" rx="10" fill="#94a3b8" fill-opacity="0.14" stroke="#94a3b8" stroke-opacity="0.5"/>
  <circle cx="896" cy="498" r="10" fill="#94a3b8"/>
  <text x="896" y="502" class="num" text-anchor="middle">4</text>
  <text x="914" y="503" class="snm" fill="#cbd5e1">List services</text>
  <text x="894" y="530" class="snote">client-go walks the</text>
  <text x="894" y="544" class="snote">Kubernetes API</text>

  <!-- 5: Cluster -->
  <rect x="1080" y="482" width="176" height="76" rx="10" fill="#94a3b8" fill-opacity="0.14" stroke="#94a3b8" stroke-opacity="0.5"/>
  <circle cx="1096" cy="498" r="10" fill="#94a3b8"/>
  <text x="1096" y="502" class="num" text-anchor="middle">5</text>
  <text x="1114" y="503" class="snm" fill="#cbd5e1">Probe endpoints</text>
  <text x="1094" y="530" class="snote">Six discovery runners</text>
  <text x="1094" y="544" class="snote">in parallel per service</text>

  <!-- 6: Agents Backend -->
  <rect x="1280" y="274" width="176" height="76" rx="10" fill="#10b981" fill-opacity="0.16" stroke="#10b981" stroke-opacity="0.6"/>
  <circle cx="1296" cy="290" r="10" fill="#10b981"/>
  <text x="1296" y="294" class="num" text-anchor="middle">6</text>
  <text x="1314" y="295" class="snm" fill="#6ee7b7">Return findings</text>
  <text x="1294" y="322" class="snote">Discovered documents</text>
  <text x="1294" y="336" class="snote">and the calls that failed</text>

  <!-- 7: Agents Backend -->
  <rect x="1480" y="274" width="176" height="76" rx="10" fill="#10b981" fill-opacity="0.16" stroke="#10b981" stroke-opacity="0.6"/>
  <circle cx="1496" cy="290" r="10" fill="#10b981"/>
  <text x="1496" y="294" class="num" text-anchor="middle">7</text>
  <text x="1514" y="295" class="snm" fill="#6ee7b7">Promote snapshot</text>
  <text x="1494" y="322" class="snote">Publishes versions into</text>
  <text x="1494" y="336" class="snote">the Portal catalogue</text>

  <!-- ===== FOOTNOTE ===== -->
  <rect x="60" y="592" width="1640" height="44" rx="10" fill="#0F172A" stroke="#1E293B"/>
  <circle cx="86" cy="614" r="3.5" fill="#fb923c"/>
  <text x="102" y="619" font-size="13" fill="#94a3b8"><tspan fill="#e2e8f0" font-weight="600">Nothing is published automatically.</tspan> Discovery produces a snapshot, and a person decides whether that snapshot becomes a catalogue version.</text>
</svg>
