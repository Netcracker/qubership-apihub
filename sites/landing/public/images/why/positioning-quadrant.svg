<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="apihubGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="48" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.6"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1400" height="1000" fill="#050813"/>

  <!-- title -->
  <text x="140" y="56" font-size="15" font-weight="600" fill="#60a5fa" letter-spacing="3">WHERE APIHUB FITS</text>
  <text x="140" y="94" font-size="30" font-weight="800" fill="#f1f5f9">Deep on contracts, <tspan fill="url(#titleGrad)">deliberately narrow</tspan> on runtime</text>

  <!-- legend -->
  <g font-size="13" fill="#94a3b8">
    <circle cx="905" cy="86" r="6" fill="#34D399"/>
    <text x="918" y="90">Open source</text>
    <circle cx="1030" cy="86" r="6" fill="#60A5FA"/>
    <text x="1043" y="90">Commercial, free tier / OSS core</text>
    <circle cx="1268" cy="86" r="6" fill="#A78BFA"/>
    <text x="1281" y="90">Enterprise contract</text>
  </g>

  <!-- plot area -->
  <rect x="140" y="130" width="1120" height="720" rx="18" fill="#0A0F1E" stroke="#1E293B"/>
  <rect x="140" y="130" width="1120" height="720" rx="18" fill="url(#grid)"/>
  <!-- quadrant highlight for APIHUB corner -->
  <rect x="140" y="130" width="560" height="360" rx="18" fill="url(#glowTL)"/>

  <!-- mid lines -->
  <line x1="700" y1="130" x2="700" y2="850" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 6"/>
  <line x1="140" y1="490" x2="1260" y2="490" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- quadrant labels -->
  <g font-size="12" font-weight="700" letter-spacing="2.2" fill="#64748b">
    <text x="164" y="160">DEEP GOVERNANCE, FOCUSED SCOPE</text>
    <text x="1236" y="160" text-anchor="end">FULL SUITES WITH GOVERNANCE</text>
    <text x="164" y="832">CATALOG &amp; RENDERING</text>
    <text x="1236" y="832" text-anchor="end">RUNTIME-FIRST</text>
  </g>

  <!-- axis: Y -->
  <g fill="#cbd5e1" font-size="13">
    <text transform="translate(58 490) rotate(-90)" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Contract governance depth</text>
    <text transform="translate(96 150) rotate(-90)" text-anchor="end" fill="#94a3b8">multi-protocol compatibility analysis · linting · quality score</text>
    <text transform="translate(96 830) rotate(-90)" text-anchor="start" fill="#94a3b8">store &amp; render specs</text>
    <path d="M 112 800 L 112 180 L 105 194 M 112 180 L 119 194" fill="none" stroke="#475569" stroke-width="1.5"/>
  </g>
  <!-- axis: X -->
  <g fill="#cbd5e1" font-size="13">
    <text x="700" y="905" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Lifecycle breadth</text>
    <text x="150" y="928" fill="#94a3b8">contracts, docs &amp; governance (design time)</text>
    <text x="1250" y="928" text-anchor="end" fill="#94a3b8">full runtime API management (gateway · traffic · monetization)</text>
    <path d="M 180 880 L 1220 880 L 1206 873 M 1220 880 L 1206 887" fill="none" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- - points - -->
  <g font-size="14" fill="#e2e8f0" filter="url(#softShadow)">
    <!-- Top-left: design-time governance -->
    <circle cx="229.6" cy="346" r="8" fill="#34D399"/>
    <text x="245" y="351">oasdiff <tspan fill="#64748b" font-size="12">(OpenAPI only, CLI)</tspan></text>

    <circle cx="476" cy="360.4" r="8" fill="#60A5FA"/>
    <text x="491" y="365">Redocly</text>

    <circle cx="420" cy="418" r="8" fill="#60A5FA"/>
    <text x="435" y="423">Bump.sh</text>

    <circle cx="588" cy="331.6" r="8" fill="#60A5FA"/>
    <text x="603" y="336">SwaggerHub / API Hub</text>

    <circle cx="543" cy="418" r="8" fill="#60A5FA"/>
    <text x="558" y="423">Stoplight</text>

    <circle cx="666.4" cy="475.6" r="8" fill="#60A5FA"/>
    <text x="681.4" y="480">Postman</text>

    <circle cx="565.6" cy="511.6" r="8" fill="#60A5FA"/>
    <text x="580.6" y="516">Azure API Center</text>

    <!-- Bottom-left: catalogs -->
    <circle cx="364" cy="562" r="8" fill="#34D399"/>
    <text x="379" y="567">Apicurio Registry</text>

    <circle cx="296.8" cy="662.8" r="8" fill="#34D399"/>
    <text x="311.8" y="667">Backstage API plugin</text>

    <circle cx="207" cy="763.6" r="8" fill="#34D399"/>
    <text x="222" y="768">Swagger UI</text>

    <!-- Top-right: suites -->
    <circle cx="1170" cy="389" r="8" fill="#A78BFA"/>
    <text x="1155" y="394" text-anchor="end">Apigee + API hub</text>

    <circle cx="1103" cy="446.8" r="8" fill="#60A5FA"/>
    <text x="1088" y="451" text-anchor="end">Kong Konnect</text>

    <circle cx="1036" cy="490" r="8" fill="#A78BFA"/>
    <text x="1021" y="495" text-anchor="end">Azure API Management</text>

    <!-- Bottom-right: runtime-first -->
    <circle cx="1080.8" cy="547.6" r="8" fill="#34D399"/>
    <text x="1065.8" y="552" text-anchor="end">WSO2 API Manager</text>

    <circle cx="1013.6" cy="590.8" r="8" fill="#60A5FA"/>
    <text x="998.6" y="595" text-anchor="end">Gravitee</text>

    <circle cx="968.8" cy="677.2" r="8" fill="#34D399"/>
    <text x="953.8" y="682" text-anchor="end">Tyk (OSS gateway)</text>

    <circle cx="901.6" cy="749.2" r="8" fill="#34D399"/>
    <text x="886.6" y="754" text-anchor="end">Kong Gateway (OSS)</text>
  </g>

  <!-- APIHUB highlighted -->
  <g>
    <circle cx="386.4" cy="216.4" r="70" fill="url(#apihubGlow)"/>
    <circle cx="386.4" cy="216.4" r="15" fill="#34D399" stroke="#f1f5f9" stroke-width="3"/>
    <text x="412" y="212" font-size="20" font-weight="800" fill="#f1f5f9">Qubership APIHUB</text>
    <text x="412" y="234" font-size="13" fill="#94a3b8">REST · GraphQL · AsyncAPI · DDL · MCP — one diff engine, one portal, Apache 2.0</text>
  </g>

  <!-- disclaimer -->
  <text x="140" y="972" font-size="12" fill="#64748b">Qualitative positioning by the APIHUB team from public product documentation and pricing, September 2026. Not a benchmark. Vendors evolve quickly — corrections welcome via GitHub issues.</text>
</svg>
