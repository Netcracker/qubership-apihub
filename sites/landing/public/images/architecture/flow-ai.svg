<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="770" viewBox="0 0 1600 770" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="aiTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <marker id="aiArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .panel  { fill: #070c1a; stroke-width: 1; }
      .plabel { font-size: 11px; font-weight: 800; letter-spacing: 2.2px; }
      .step   { fill: #0F172A; stroke: #1E293B; stroke-width: 1; }
      .snm    { font-size: 14px; font-weight: 700; fill: #e2e8f0; }
      .snote  { font-size: 11.5px; fill: #94a3b8; }
      .num    { font-size: 11.5px; font-weight: 800; fill: #050813; }
    </style>
  </defs>

  <rect width="1600" height="770" fill="#050813"/>

  <text x="60" y="54" font-size="15" font-weight="600" fill="#a78bfa" letter-spacing="3">DYNAMIC VIEW &#183; 03</text>
  <text x="60" y="96" font-size="30" font-weight="800" fill="#f1f5f9">How an AI agent reads the catalogue. <tspan fill="url(#aiTitle)">Two doors, one room.</tspan></text>
  <text x="60" y="132" font-size="13.5" fill="#64748b">An external client over MCP, or the chat built into the Portal. Both end up calling the same access-checked tools.</text>

  <!-- ===== PATH A ===== -->
  <rect x="60" y="158" width="720" height="398" rx="16" class="panel" stroke="#818cf8" stroke-opacity="0.4"/>
  <text x="86" y="186" class="plabel" fill="#818cf8">PATH A &#183; EXTERNAL MCP CLIENT</text>

  <rect x="86" y="204" width="668" height="76" rx="10" class="step"/>
  <circle cx="112" cy="230" r="13" fill="#818cf8"/>
  <text x="112" y="234" class="num" text-anchor="middle">1</text>
  <text x="142" y="235" class="snm">Client initialises</text>
  <text x="142" y="259" class="snote">Cursor, Claude or a bot authenticates with an API key or a personal access token</text>

  <rect x="86" y="292" width="668" height="76" rx="10" class="step"/>
  <circle cx="112" cy="318" r="13" fill="#818cf8"/>
  <text x="112" y="322" class="num" text-anchor="middle">2</text>
  <text x="142" y="323" class="snm">Session opens</text>
  <text x="142" y="347" class="snote">Streamable HTTP transport, idle timeout of 15 minutes</text>

  <rect x="86" y="380" width="668" height="76" rx="10" class="step"/>
  <circle cx="112" cy="406" r="13" fill="#818cf8"/>
  <text x="112" y="410" class="num" text-anchor="middle">3</text>
  <text x="142" y="411" class="snm">Tool call</text>
  <text x="142" y="435" class="snote">Search, specification, diff or document &#8212; see the shared tools below</text>

  <rect x="86" y="468" width="668" height="76" rx="10" class="step"/>
  <circle cx="112" cy="494" r="13" fill="#818cf8"/>
  <text x="112" y="498" class="num" text-anchor="middle">4</text>
  <text x="142" y="499" class="snm">Backend answers</text>
  <text x="142" y="523" class="snote">Access control is applied per user before anything is returned</text>

  <!-- ===== PATH B ===== -->
  <rect x="820" y="158" width="720" height="398" rx="16" class="panel" stroke="#a78bfa" stroke-opacity="0.4"/>
  <text x="846" y="186" class="plabel" fill="#a78bfa">PATH B &#183; THE BUILT-IN CHAT</text>

  <rect x="846" y="204" width="668" height="76" rx="10" class="step"/>
  <circle cx="872" cy="230" r="13" fill="#a78bfa"/>
  <text x="872" y="234" class="num" text-anchor="middle">1</text>
  <text x="902" y="235" class="snm">Question arrives</text>
  <text x="902" y="259" class="snote">Streamed over server-sent events from the Portal</text>

  <rect x="846" y="292" width="668" height="76" rx="10" class="step"/>
  <circle cx="872" cy="318" r="13" fill="#a78bfa"/>
  <text x="872" y="322" class="num" text-anchor="middle">2</text>
  <text x="902" y="323" class="snm">Model plans</text>
  <text x="902" y="347" class="snote">The same catalogue tools, plus a tool for asking the user to clarify</text>

  <rect x="846" y="380" width="668" height="76" rx="10" class="step"/>
  <circle cx="872" cy="406" r="13" fill="#a78bfa"/>
  <text x="872" y="410" class="num" text-anchor="middle">3</text>
  <text x="902" y="411" class="snm">Loop runs</text>
  <text x="902" y="435" class="snote">Up to ten tool calls per turn, each one access-checked independently</text>

  <rect x="846" y="468" width="668" height="76" rx="10" class="step"/>
  <circle cx="872" cy="494" r="13" fill="#a78bfa"/>
  <text x="872" y="498" class="num" text-anchor="middle">4</text>
  <text x="902" y="499" class="snm">Answer streams back</text>
  <text x="902" y="523" class="snote">Generated files are offered as temporary downloads</text>

  <!-- ===== CONVERGENCE ===== -->
  <path d="M 420 556 V 584 H 800 V 604" fill="none" stroke="#64748b" stroke-width="1.75" marker-end="url(#aiArrow)"/>
  <path d="M 1180 556 V 584 H 800" fill="none" stroke="#64748b" stroke-width="1.75"/>

  <rect x="60" y="614" width="1480" height="106" rx="16" fill="#0b1020" stroke="#2dd4bf" stroke-opacity="0.35"/>
  <text x="86" y="642" class="plabel" fill="#2dd4bf">SHARED CATALOGUE TOOLS</text>

  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12.5" fill="#5eead4">
    <rect x="86" y="658" width="346" height="44" rx="9" fill="#050813" stroke="#1E293B"/>
    <text x="259" y="685" text-anchor="middle">search_api_operations</text>
    <rect x="448" y="658" width="346" height="44" rx="9" fill="#050813" stroke="#1E293B"/>
    <text x="621" y="685" text-anchor="middle">get_api_operation_specification</text>
    <rect x="810" y="658" width="346" height="44" rx="9" fill="#050813" stroke="#1E293B"/>
    <text x="983" y="685" text-anchor="middle">get_api_operation_diff</text>
    <rect x="1172" y="658" width="346" height="44" rx="9" fill="#050813" stroke="#1E293B"/>
    <text x="1345" y="685" text-anchor="middle">get_document</text>
  </g>

  <text x="60" y="754" font-size="13.5" fill="#64748b">The linter exposes a further MCP endpoint of its own, so an agent can ask what is wrong with a version and receive the issue list directly.</text>
</svg>
