openapi: 3.0.3
info:
  title: Deprecated removal, an operation deprecated in its own right
  version: 1.0.0
paths:
  # The property is announced here for the first time, so by the third version it has been carried by one
  # released version only: not long enough to earn anyone a downgrade.
  /retired:
    post:
      operationId: retired
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Shared'
      responses:
        '200':
          description: OK
  /current:
    post:
      operationId: current
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Shared'
      responses:
        '200':
          description: OK
components:
  schemas:
    Shared:
      type: object
      properties:
        legacy:
          type: string
          deprecated: true
        keep:
          type: string
