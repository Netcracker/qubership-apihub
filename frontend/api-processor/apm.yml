name: qubership-apihub-api-processor
version: 1.0.0
description: TypeScript/Node.js library that processes API source specifications (REST/OpenAPI, GraphQL, text, and unknown files) into a package-version build result- parsed documents, extracted operations, optional version comparisons (changelog), export artifacts, and notifications.
author: Qubership APIHUB

targets:
  - claude
  - cursor

dependencies:
  apm:
    - Netcracker/qubership-apihub-ddlapi/agent-packages/ddlapi-using
    - Netcracker/qubership-apihub-json-crawl/agent-packages/json-crawl-using
