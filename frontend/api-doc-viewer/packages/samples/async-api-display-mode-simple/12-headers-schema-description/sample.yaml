asyncapi: 3.0.0
info:
  title: Display mode
  version: 1.0.0
channels:
  testChannel:
    address: events.default
    messages:
      TestMessage:
        $ref: "#/components/messages/TestMessage"
operations:
  sendOperation:
    action: send
    channel:
      $ref: "#/channels/testChannel"
    messages:
      - $ref: "#/components/messages/TestMessage"
components:
  messages:
    TestMessage:
      name: TestMessage
      headers:
        type: object
        properties:
          traceId:
            type: string
            description: Trace identifier
