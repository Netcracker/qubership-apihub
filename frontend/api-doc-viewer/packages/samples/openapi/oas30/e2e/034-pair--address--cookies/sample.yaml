openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
paths:
  /api/v2/stores/main-store/orders/pending/export-requests:
    post:
      parameters:
        - name: session
          in: cookie
          required: true
          schema:
            type: string
        - name: theme
          in: cookie
          schema:
            type: string
            enum:
              - light
              - dark
      responses:
        "200":
          description: ""
