openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
paths:
  /orders:
    post:
      parameters:
        - name: dryRun
          in: query
          description: Validate without storing.
          schema:
            type: boolean
            default: false
        - name: expand
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - lines
                - customer
      responses:
        "200":
          description: ""
          headers:
            ETag:
              schema:
                type: string
            X-Rate-Limit-Remaining:
              description: Requests left in the window.
              schema:
                type: integer
