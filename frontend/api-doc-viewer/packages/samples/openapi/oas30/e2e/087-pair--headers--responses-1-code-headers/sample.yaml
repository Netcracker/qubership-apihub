openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
paths:
  /orders:
    post:
      parameters:
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Trace
          in: header
          schema:
            type: string
      responses:
        "200":
          description: ""
          headers:
            ETag:
              schema:
                type: string
            X-Rate-Limit-Remaining:
              description: Requests left in the window.
              schema:
                type: integer
