openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
paths:
  /api/v2/stores/main-store/orders/pending/export-requests:
    post:
      requestBody:
        description: New order state.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - new
                    - paid
                note:
                  type: string
      responses:
        "200":
          description: ""
