openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
paths:
  /orders:
    post:
      description: |-
        Replaces the order with the given state.

        - Validates the **status** transition.
        - Returns the stored order.
      parameters:
        - name: dryRun
          in: query
          description: Validate without storing.
          schema:
            type: boolean
            default: false
        - name: expand
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - lines
                - customer
      responses:
        "200":
          description: ""
