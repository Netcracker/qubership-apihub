openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
paths:
  /orders:
    post:
      security:
        - stub_key: []
        - scheme-description: []
      responses:
        "200":
          description: ""
components:
  securitySchemes:
    stub_key:
      type: apiKey
      in: header
      name: X-Stub-Key
    scheme-description:
      type: apiKey
      in: header
      name: X-API-Key
      description: |-
        Key issued in the **developer portal**.

        - Send it with every request.
        - Rotate it every 90 days.
