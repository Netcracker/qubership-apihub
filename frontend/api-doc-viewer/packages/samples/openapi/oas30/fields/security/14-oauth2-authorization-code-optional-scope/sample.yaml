openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
paths:
  /orders:
    post:
      security:
        - stub_key: []
        - oauth2-authorization-code: []
      responses:
        "200":
          description: ""
components:
  securitySchemes:
    stub_key:
      type: apiKey
      in: header
      name: X-Stub-Key
    oauth2-authorization-code:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          scopes:
            orders:read: Read orders
