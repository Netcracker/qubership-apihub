openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
paths:
  /orders:
    post:
      security:
        - stub_key: []
        - api-key-query: []
      responses:
        "200":
          description: ""
components:
  securitySchemes:
    stub_key:
      type: apiKey
      in: header
      name: X-Stub-Key
    api-key-query:
      type: apiKey
      in: query
      name: api_key
