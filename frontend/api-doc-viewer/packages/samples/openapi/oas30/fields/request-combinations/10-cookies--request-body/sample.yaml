openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
paths:
  /orders:
    post:
      parameters:
        - name: session
          in: cookie
          required: true
          schema:
            type: string
        - name: theme
          in: cookie
          schema:
            type: string
            enum:
              - light
              - dark
        - name: legacy_session
          in: cookie
          deprecated: true
          schema:
            type: string
        - name: prefs
          in: cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  from:
                    type: string
                    format: date
      requestBody:
        description: New order state.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                status:
                  type: string
                  enum:
                    - new
                    - paid
      responses:
        "200":
          description: ""
