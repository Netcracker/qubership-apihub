openapi: 3.0.3
info:
  title: Property rename sample
  version: 1.0.0
paths:
  '/reports/{filter}':
    get:
      parameters:
        - name: filter
          in: path
          required: true
          description: Report filter.
          schema:
            type: object
            properties:
              from:
                type: string
                format: date
                description: First day of the period.
              to:
                type: string
                format: date
                description: Last day of the period.
      responses:
        '200':
          description: OK
