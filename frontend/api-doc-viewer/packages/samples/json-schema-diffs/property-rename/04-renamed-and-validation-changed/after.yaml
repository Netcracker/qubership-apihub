openapi: 3.0.3
info:
  title: Property rename sample
  version: 1.0.0
paths:
  '/users/{userId}/orders/{orderId}':
    get:
      parameters:
        - name: userId
          in: path
          required: true
          description: User identifier.
          schema:
            type: string
            maxLength: 64
            pattern: '^[a-z0-9-]+$'
        - name: orderId
          in: path
          required: true
          description: Order identifier.
          schema:
            type: integer
      responses:
        '200':
          description: OK
