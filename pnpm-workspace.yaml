packages:
  - 'frontend/*'
  - 'frontend/*/packages/*'
  - 'tests/ui-tests'
  - 'tools/build-id'
  - 'tools/jest-chrome-in-docker-environment'
  - 'sites/*'

# One version of each build and test tool for the whole workspace. A project still declares what it
# uses, with "catalog:" as the version, so each project resolves the same copy (#943: caret ranges let
# vite drift apart between packages). Change a version here, never in a package.json. A project on
# another major version (Storybook 8 and 9 in apispec-view and rest-playground) keeps its own range
# until it moves. `pnpm publish` writes the version from here into the published package.json.
catalog:
  '@storybook/addon-docs': 10.6.3
  '@storybook/addon-links': 10.6.3
  '@storybook/html-vite': 10.6.3
  '@storybook/react-vite': 10.6.3
  '@types/jest': 30.0.0
  '@types/node': 24.13.3
  '@vitejs/plugin-react': 6.1.1
  eslint-plugin-storybook: 10.6.3
  jest: 30.4.2
  jest-util: 30.4.1
  storybook: 10.6.3
  ts-jest: 29.4.12
  typescript: 6.0.3
  vite: 8.2.2
  vite-plugin-dts: 4.5.4
  vite-tsconfig-paths: 4.3.2

# Settings other than auth and registry live here, not in .npmrc: pnpm 12 ignores them there without a
# warning. An unknown key here fails with ERR_PNPM_UNRECOGNIZED_WORKSPACE_SETTINGS.

# Each project resolves only its declared dependencies, so every import and every binary a script
# runs must be declared, and scripts use pnpm run, not npm run.
nodeLinker: isolated

strictPeerDependencies: false

# Every dependency build script in the lockfile, each denied. A new one fails `pnpm install`
# (ERR_PNPM_IGNORED_BUILDS) until it is added here.
allowBuilds:
  # Native binaries ship as optional platform packages; these scripts only verify or relink them.
  esbuild: false
  unrs-resolver: false
  # Nx Cloud client update; this workspace does not use Nx Cloud.
  nx: false
  # Downloads Chrome; the screenshot suites use Chrome in a container.
  puppeteer: false
  # husky 4 installs git hooks.
  husky: false
  # Banners and telemetry.
  core-js: false
  es5-ext: false
  '@fortawesome/fontawesome-common-types': false
  '@fortawesome/fontawesome-svg-core': false
  '@scarf/scarf': false
  # Refreshes the mock service worker file in the workerDirectory; `pnpm run msw:init` does that on demand.
  msw: false
  # Native binaries ship as optional platform packages; the script only falls back to a local build.
  sharp: false

# Lets `pnpm deploy` build build-task-consumer's production tree without injectWorkspacePackages,
# which would change how every internal dependency resolves.
forceLegacyDeploy: true

# `pnpm run` and `pnpm exec` do not install first. With the pnpm 11 default, the first pnpm command
# after `pnpm deploy --prod` reinstalled the workspace without devDependencies and removed nx.
verifyDepsBeforeRun: false

# pnpm applies overrides only from this file; an overrides block in any package.json is ignored.
overrides:
  # jest-environment-puppeteer 11 pulls jest-environment-node 29 beside jest 30, and jest then
  # fails at load with `this._moduleMocker.clearMocksOnScope is not a function` (gap G15).
  jest-environment-node: 30.4.1
  jest-mock: 30.4.1

  # @stoplight/mosaic depends on @types/react 17, which breaks every React 18 consumer with TS2786
  # (gap G23). `$` resolves against the root package.json, so the whole workspace gets one version.
  '@stoplight/mosaic>@types/react': '$@types/react'
  '@stoplight/mosaic>@types/react-dom': '$@types/react-dom'

patchedDependencies:
  '@nx/maven@23.2.0': patches/@nx__maven@23.2.0.patch

# `pnpm deploy` (legacy mode, see build-task-consumer) installs only one package. It would fail with
# ERR_PNPM_UNUSED_PATCH because the root-only @nx/maven patch has no target there.
allowUnusedPatches: true
