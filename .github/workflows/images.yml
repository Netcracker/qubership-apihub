name: Build images

# Builds an image only when its content hash is new, and otherwise retags the existing one
# (tools/ci/image-input-hash.sh computes the hash). ci.yml calls this workflow once per language,
# so each language's images wait only for that language's tests: `needs` applies to a whole job,
# not to a matrix leg. Nothing is passed between jobs; a JavaScript leg restores its build from
# the Nx cache, a Java leg builds its jar with Maven, and a Go leg compiles inside the image.
#
# Images go to ghcr.io/<repository owner>/<image>, under the names the product has always used
# (qubership-apihub-backend, qubership-api-linter-service, and so on).
#
# Platforms (release design R3): linux/amd64 and linux/arm64 for `release` and `main`, linux/amd64
# only for every other ref. A content hash that exists for amd64 only is rebuilt on those two
# branches, so `:next` and `:latest` never point at a single-architecture image.

on:
  workflow_call:
    inputs:
      images:
        description: >-
          JSON array of matrix legs. Each is {project, image, dockerfile, build_projects, deploy,
          context, dockerignore, workspace_build, outputs}. `outputs` is optional: space-separated
          paths (globs allowed) that must exist after the Nx build; empty means `<root>/dist` of
          every build project.
        required: true
        type: string

jobs:
  images:
    # The image name only: the default name lists every matrix field of the leg.
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # release-finish.yml leaves main and release at the same commit, and both CI runs build images for
    # it. The content hash does not depend on the ref and both refs require amd64 and arm64, so the
    # second leg finds the first one's src-<hash> and only retags, but only if it checks after the first
    # pushed. This group makes the legs of the same image at the same commit on those two refs wait for
    # each other; not cancelled, so both legs run. Every other ref gets a group of its own run.
    concurrency:
      group: >-
        images-${{ matrix.image }}-${{
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
          && github.sha
          || format('{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Everything that differs between images is a field on a leg.
        include: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Per leg: inside a reusable workflow `github.job` is the same for both callers and all legs.
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: images-${{ matrix.image }}

      # Refs and names reach the scripts through env, never through `${{ }}` inside the script text:
      # a branch name may contain quotes.
      - name: Choose the platforms
        id: platforms
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/release|refs/heads/main)
              echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
              echo "multi=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "value=linux/amd64" >> "$GITHUB_OUTPUT"
              echo "multi=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Emulation for the arm64 stages that run commands. The Go stages cross-compile on the build
      # platform and the JavaScript images copy a prebuilt tree, so the cost is small.
      - uses: docker/setup-qemu-action@v4
        if: steps.platforms.outputs.multi == 'true'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # develop -> dev, release -> next, main -> latest, feature/x -> feature-x, a pull request ->
      # pull-N-merge (tools/ci/branch-tag.sh).
      - name: Compute tags
        id: tags
        shell: bash
        env:
          REF: ${{ github.ref }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          BUILD_PROJECTS: ${{ matrix.build_projects }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          DOCKERIGNORE: ${{ matrix.dockerignore }}
        run: |
          set -euo pipefail
          branch_tag="$(bash tools/ci/branch-tag.sh "$REF")"

          pnpm exec nx graph --file=graph.json >/dev/null
          # The ignore files decide what reaches the build context, so they are part of the hash.
          # `DOCKERIGNORE` is a space-separated list, deliberately unquoted.
          # shellcheck disable=SC2086
          src_hash="$(bash tools/ci/image-input-hash.sh "$BUILD_PROJECTS" graph.json "$DOCKERFILE" $DOCKERIGNORE)"

          repo_lc="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          base="ghcr.io/${repo_lc}/${IMAGE}"

          echo "branch_tag=$branch_tag"           >> "$GITHUB_OUTPUT"
          echo "src_tag=src-$src_hash"            >> "$GITHUB_OUTPUT"
          echo "base=$base"                       >> "$GITHUB_OUTPUT"
          echo "### $IMAGE"                       >> "$GITHUB_STEP_SUMMARY"
          echo "- content tag: \`src-$src_hash\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- branch tag:  \`$branch_tag\`"   >> "$GITHUB_STEP_SUMMARY"
          echo "- platforms:   \`${{ steps.platforms.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"

      # A hit needs the platforms this ref publishes: content built on develop for amd64 only is a
      # miss on release and main.
      - name: Has this content already been built?
        id: exists
        shell: bash
        env:
          CONTENT_IMAGE: ${{ steps.tags.outputs.base }}:${{ steps.tags.outputs.src_tag }}
          MULTI: ${{ steps.platforms.outputs.multi }}
        run: |
          set -euo pipefail
          hit=false
          if raw="$(docker buildx imagetools inspect --raw "$CONTENT_IMAGE" 2>/dev/null)"; then
            if [ "$MULTI" != 'true' ]; then
              hit=true
            elif node -e '
              const m = JSON.parse(require("fs").readFileSync(0, "utf8"))
              const archs = (m.manifests || []).map((x) => x.platform && x.platform.architecture)
              process.exit(archs.includes("arm64") && archs.includes("amd64") ? 0 : 1)
            ' <<< "$raw"; then
              hit=true
            else
              echo "- this content exists without arm64, so it is rebuilt for this ref" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          if [ "$hit" = true ]; then
            echo "- **cache hit** — this content exists, so no build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- cache miss — building this content" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---- miss: build ------------------------------------------------------------------
      # --projects takes a comma-separated list; a space-separated one matches nothing and exits 0.
      # For a Java leg this runs `mvn verify` through the project's `build` target.
      - name: Build the workspace output
        if: steps.exists.outputs.hit == 'false' && matrix.workspace_build == 'true'
        run: |
          set -o pipefail
          pnpm exec nx run-many -t build --projects='${{ matrix.build_projects }}' 2>&1 | tee "$RUNNER_TEMP/nx.log"

      # A production node_modules for the image, written on the host. The filter is a path: pnpm
      # filters on package name or path, and the Nx project name matches nothing and exits 0.
      # `allowUnusedPatches` in pnpm-workspace.yaml lets the legacy deploy ignore the root-only
      # @nx/maven patch.
      - name: Produce the deploy tree
        if: steps.exists.outputs.hit == 'false' && matrix.deploy != ''
        run: pnpm deploy --filter='./frontend/${{ matrix.deploy }}' --prod '.deploy/${{ matrix.deploy }}'

      # Both commands above exit 0 when they match nothing, so check the COPY sources before the build.
      - name: Verify the build outputs exist
        if: steps.exists.outputs.hit == 'false' && matrix.workspace_build == 'true'
        shell: bash
        env:
          OUTPUTS: ${{ matrix.outputs }}
        run: |
          set -euo pipefail

          # With pnpm 11's default verifyDepsBeforeRun, the pnpm command after the deploy reinstalled
          # the workspace without devDependencies and removed nx.
          [ -d node_modules/nx ] || {
            echo "::error::node_modules/nx is gone after the deploy — check verifyDepsBeforeRun in pnpm-workspace.yaml"
            exit 1
          }

          missing=0
          check() {
            if compgen -G "$1" >/dev/null; then
              echo "  OK      $1  ($(compgen -G "$1" | wc -l) match(es))"
            else
              echo "  MISSING $1"
              missing=1
            fi
          }
          if [ -n "$OUTPUTS" ]; then
            for p in $OUTPUTS; do
              check "$p"
            done
          else
            for p in $(echo '${{ matrix.build_projects }}' | tr ',' ' '); do
              root="$(pnpm exec nx show project "$p" --json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).root')"
              check "$root/dist"
            done
          fi
          if [ -n '${{ matrix.deploy }}' ]; then
            check '.deploy/${{ matrix.deploy }}/package.json'
            check '.deploy/${{ matrix.deploy }}/node_modules'
          fi
          [ "$missing" = "0" ] || { echo "::error::build outputs missing — the docker build would fail on a COPY source"; exit 1; }

      - name: Build and push
        if: steps.exists.outputs.hit == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          provenance: false
          # Only the content tag. Annotations belong to a manifest and every tag on it shares them,
          # so the next step gives each branch tag its own index with its own annotations.
          tags: ${{ steps.tags.outputs.base }}:${{ steps.tags.outputs.src_tag }}
          # No GIT_BRANCH or GIT_HASH build args: they are not in the content hash, so a retagged image
          # reported the wrong ref. Hashing them would rebuild identical content once per ref.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # ---- both paths: publish the branch tag -------------------------------------------
      # A registry-side operation of about a second, on both paths. `imagetools create` wraps the
      # content in a new index per tag, which carries this ref's annotations. `index:` is required:
      # annotations apply to an index or a descriptor, never to a manifest.
      - name: Point the branch tag at this content
        shell: bash
        env:
          BASE: ${{ steps.tags.outputs.base }}
          SRC_TAG: ${{ steps.tags.outputs.src_tag }}
          BRANCH_TAG: ${{ steps.tags.outputs.branch_tag }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=$SHA" \
            --annotation "index:org.opencontainers.image.version=$REF_NAME" \
            --annotation "index:org.opencontainers.image.source=$SOURCE_URL" \
            -t "$BASE:$BRANCH_TAG" \
            "$BASE:$SRC_TAG"

          # Read the annotation back: an unprefixed or misspelled --annotation level is not an
          # error, and the tag would be published without provenance.
          raw="$(docker buildx imagetools inspect --raw "$BASE:$BRANCH_TAG")"
          got="$(node -e '
            const m = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const a = m.annotations || {}
            process.stdout.write(a["org.opencontainers.image.version"] || "")
          ' <<< "$raw")"
          if [ "$got" != "$REF_NAME" ]; then
            echo "::error::branch tag published without its provenance — expected version='$REF_NAME', read '$got'"
            echo "$raw" | head -40
            exit 1
          fi
          echo "- provenance on \`$BRANCH_TAG\`: version=\`$got\`, revision=\`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      # On a retag no Nx build ran; the script reports the missing log instead of failing.
      - name: cache summary
        if: always()
        run: bash tools/ci/cache-summary.sh 'images (${{ matrix.image }})' "$RUNNER_TEMP/nx.log" >> "$GITHUB_STEP_SUMMARY"
