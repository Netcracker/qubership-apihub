'on':
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the plan without releasing. Leave checked until you have read it.'
        type: boolean
        default: true
      sprint:
        description: 'Project 9 sprint name for the product release notes, such as APIHUB-26.3.5. Required for a real run.'
        type: string
        required: false
        default: ''

name: Release finish

# Releases the candidate on `release`:
#   1. fast-forward `main` to `release`;
#   2. write the version plan (tools/release/version-plan.js) and run `nx release version`, which bumps
#      the package.json files, commits `chore(release): publish`, and creates the <component>/<version> tags;
#   3. tag the same commit with the product version (tools/release/product-version.js);
#   4. push `main` and the tags atomically, or stop with "nothing to release";
#   5. fast-forward `release` to `main`, so the next hotfix starts from the released state;
#   6. make sure CI runs on `main` (it builds the images, packages, and GitHub Releases), then merge `main`
#      into `develop` and make sure CI runs there.
# A dry run (the default) does steps 1 and 2 locally in the runner and prints the plan to the job summary;
# it cannot push, because the job then checks out without the deploy key.
#
# Dispatch it from `develop`, the default branch (Actions → Release finish → Run workflow, branch
# develop): a real run refuses the workflow file of any other branch. It always releases `release`,
# whatever branch it is dispatched from. The images, npm packages, and GitHub Releases follow in the
# release-artifacts job of the CI run on main.
#
# The bot pushes with the deploy key apihub-release-bot (secret RELEASE_BOT_SSH_KEY): the rulesets let it
# bypass them, and its pushes start workflows, which a GITHUB_TOKEN push does not.

concurrency:
  # Never cancelled: a run stopped between the push and the back-merge leaves the branches apart. Dry and
  # real runs queue apart, because a newer pending run replaces an older pending run of the same group.
  group: release-finish-${{ inputs.dry_run && 'dry' || 'real' }}
  cancel-in-progress: false

permissions: {}

env:
  HUSKY: '0'

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A real run moves main and release: release-start.yml takes the same group, so it cannot fast-forward
    # release between the push of main and the fast-forward of release.
    concurrency:
      group: ${{ inputs.dry_run && format('release-finish-dry-{0}', github.run_id) || 'release-branches' }}
      cancel-in-progress: false
    permissions:
      contents: read # checkout; every push uses the deploy key
      actions: write # find or dispatch the CI run on main
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      SPRINT: ${{ inputs.sprint }}
    steps:
      - name: Check the inputs
        shell: bash
        env:
          HAS_KEY: ${{ secrets.RELEASE_BOT_SSH_KEY != '' }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The sprint goes into the job summary and the product tag message: the same rule in both modes.
          if [ -n "$SPRINT" ] && ! [[ "$SPRINT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::The sprint input may hold letters, digits, '.', '_', and '-' only, such as APIHUB-26.3.5."
            exit 1
          fi
          if [ "$DRY_RUN" = 'true' ]; then
            echo "::notice::Dry run: the plan goes to the job summary; nothing is committed, tagged, or pushed."
            exit 0
          fi
          if [ -z "$SPRINT" ]; then
            echo "::error::A real run needs the sprint input, such as APIHUB-26.3.5."
            exit 1
          fi
          if [ "$WORKFLOW_BRANCH" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Dispatch a real release from $DEFAULT_BRANCH (the default branch), not from $WORKFLOW_BRANCH."
            exit 1
          fi
          if [ "$HAS_KEY" != 'true' ]; then
            echo "::error::The secret RELEASE_BOT_SSH_KEY is not set. The bot pushes with the deploy key apihub-release-bot."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          # No key in a dry run, so nothing in it can push.
          ssh-key: ${{ !inputs.dry_run && secrets.RELEASE_BOT_SSH_KEY || '' }}
          # Full history and tags: a shallow clone resolves versions wrongly without failing.
          fetch-depth: 0

      - name: Fast-forward main to release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --force --tags origin '+refs/heads/main:refs/remotes/origin/main' \
              '+refs/heads/release:refs/remotes/origin/release' && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 5))
          done

          git switch --force-create main origin/main
          echo "main    $(git rev-parse --short HEAD)"
          echo "release $(git rev-parse --short origin/release)"
          if ! git merge --ff-only origin/release; then
            echo "::error::main cannot fast-forward to release: they have diverged. A person decides how to reconcile them."
            exit 1
          fi
          echo "main is at $(git rev-parse --short HEAD)"

          if [ "$DRY_RUN" != 'true' ]; then
            # Fails now, before anything is tagged, when the key cannot push or main moved.
            git push --dry-run origin HEAD:refs/heads/main
          fi

      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: release-finish

      - name: Plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Sprint: ${SPRINT:-not given}. main and release at \`$(git rev-parse --short HEAD)\`."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          # After a release, release and main both sit on the tagged version commit: a re-run finds nothing.
          released="$(git tag --points-at HEAD | grep -E '(^|/)[0-9]+\.[0-9]+\.[0-9]+$' | tr '\n' ' ' || true)"
          if [ -n "$released" ]; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to release: $(git rev-parse --short HEAD) is already released ($released)."
            echo "**Nothing to release.** This commit is already released: ${released% }." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$DRY_RUN" = 'true' ]; then
            node tools/release/plan.js --mode 'dry run'
          else
            node tools/release/plan.js --mode 'real run' --keep-plan
          fi
          if [ -f .nx/version-plans/release.md ]; then
            echo "components=true" >> "$GITHUB_OUTPUT"
            cat .nx/version-plans/release.md
          fi

      - name: Version and tag
        if: inputs.dry_run == false
        id: version
        shell: bash
        env:
          COMPONENTS: ${{ steps.plan.outputs.components }}
          ALREADY_RELEASED: ${{ steps.plan.outputs.already_released }}
        run: |
          set -euo pipefail
          if [ "$ALREADY_RELEASED" = 'true' ]; then
            : > "$RUNNER_TEMP/tags.txt"
            exit 0
          fi
          git tag --points-at HEAD | sort > "$RUNNER_TEMP/tags-before.txt"
          if [ "$COMPONENTS" = 'true' ]; then
            # tools/release/guard.js (preVersionCommand) refuses any branch but main.
            pnpm exec nx release version --git-commit --git-tag --git-commit-message 'chore(release): publish'
            if [ -z "$(git tag --points-at HEAD)" ]; then
              echo "::error::The version plan bumps components, but nx release version created no tag."
              exit 1
            fi
          fi

          # After the component tags: the product version reads the bumps from the tags at HEAD.
          product="$(node tools/release/product-version.js)"
          if [ -n "$product" ]; then
            git tag --annotate "$product" --message "APIHUB $product" --message "Sprint: $SPRINT"
          fi

          # Only the tags this run created; nx release version moves HEAD to its commit when it versions.
          git tag --points-at HEAD | sort | comm -13 "$RUNNER_TEMP/tags-before.txt" - > "$RUNNER_TEMP/tags.txt"
          echo "tags at $(git rev-parse --short HEAD): $(tr '\n' ' ' < "$RUNNER_TEMP/tags.txt")"

      - name: Push main and the tags
        if: inputs.dry_run == false
        id: push
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tags < "$RUNNER_TEMP/tags.txt"
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::notice::Nothing to release: no new component or deploy/ change since the last tags."
            echo "**Nothing to release.** No branch moved; no back-merge." >> "$GITHUB_STEP_SUMMARY"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One atomic push: either main and every tag land, or nothing does and the run can be repeated.
          refspecs=("HEAD:refs/heads/main")
          for tag in "${tags[@]}"; do refspecs+=("refs/tags/$tag:refs/tags/$tag"); done
          git push --atomic origin "${refspecs[@]}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

          for tag in "${tags[@]}"; do
            git ls-remote --exit-code origin "refs/tags/$tag" > /dev/null \
              || { echo "::error::Tag $tag is not on the remote after the push."; exit 1; }
          done
          {
            echo "**Released** at \`$(git rev-parse --short HEAD)\`:"
            echo ""
            for tag in "${tags[@]}"; do echo "- \`$tag\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fast-forward release to main
        if: steps.push.outputs.pushed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git push origin HEAD:refs/heads/release; then
            echo "::error::release moved during the run (a hotfix?) and cannot fast-forward to main. Merge main into release by hand; CI and the back-merge still run."
            exit 1
          fi

      - name: Start CI on main
        if: ${{ !cancelled() && steps.push.outputs.pushed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/release/ensure-ci.sh main "$(git rev-parse HEAD)"

  back-merge:
    needs: [finish]
    # Also after a failed fast-forward of release: main is released either way, and develop needs it.
    if: ${{ !cancelled() && needs.finish.outputs.pushed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout; the push uses the deploy key
      actions: write # find or dispatch the CI run on develop
    steps:
      - uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.RELEASE_BOT_SSH_KEY }}
          fetch-depth: 0

      # release-sync.yml may merge the same commits first, after the fast-forward of release; then this
      # finds develop up to date, or merges again when develop moved.
      - name: Merge main into develop
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash tools/release/merge-into.sh main develop

      - name: Start CI on develop
        if: steps.merge.outputs.merged == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.merge.outputs.sha }}
        run: bash tools/release/ensure-ci.sh develop "$SHA"
