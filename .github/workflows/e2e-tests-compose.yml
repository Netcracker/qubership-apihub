name: Run E2E tests using Podman Compose

# Brings the product up under podman compose on one runner, then runs Newman over the REST API
# (tests/postman-collections) and the Playwright Portal project (tests/ui-tests). The stack is one of
# the two compose folders under deploy/docker-compose: apihub-generic, or with-keycloak, which adds
# Keycloak with its SAML and OIDC providers. Compose runs no agent.
#
# deploy_ref, postman_ref, and playwright_ref take deploy/, the Postman collections, and the
# Playwright suite from another ref of this repository; empty means the commit that started the run.
# Images come from ghcr.io/<repository owner> at the tags of image_tags (`agent` is ignored here).
#
# Keep the inputs shared with e2e-tests-kind.yml identical. Credentials: the four E2E secrets of the
# repository when they are set; otherwise each run generates its own.

on:
  workflow_call:
    inputs:
      tier:
        description: >-
          full runs everything; smoke runs the Portal smoke collection and the @smoke-tagged
          Playwright tests. Setup is the same either way and is most of the fixed cost.
        required: false
        type: string
        default: full
      compose_folder:
        description: apihub-generic or with-keycloak, the folder under deploy/docker-compose.
        required: false
        type: string
        default: apihub-generic
      image_tags:
        description: >-
          JSON object with the keys backend, buildTaskConsumer, ui, apiLinterService, agentsBackend,
          and agent. A missing key takes default_image_tag. A src-<hash> tag pins exact content.
        required: false
        type: string
        default: '{}'
      default_image_tag:
        description: Tag of every image whose key is missing in image_tags.
        required: false
        type: string
        default: dev
      deploy_ref:
        description: Ref (branch, tag, or commit) of deploy/. Empty means this commit.
        required: false
        type: string
        default: ''
      postman_ref:
        description: Ref of tests/postman-collections. Empty means this commit.
        required: false
        type: string
        default: ''
      playwright_ref:
        description: Ref of tests/ui-tests. Empty means this commit.
        required: false
        type: string
        default: ''
      suites:
        description: all, postman, or playwright.
        required: false
        type: string
        default: all
      postman_collections:
        description: >-
          Comma-separated collections, as paths under tests/postman-collections or bare names of the
          e2e folder. Empty means the default list.
        required: false
        type: string
        default: ''
      playwright_args:
        description: Arguments of `playwright test`. Empty means the default.
        required: false
        type: string
        default: ''
    secrets:
      APIHUB_ACCESS_TOKEN:
        required: false
      APIHUB_ADMIN_EMAIL:
        required: false
      APIHUB_ADMIN_PASSWORD:
        required: false
      JWT_PRIVATE_KEY:
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The first full run took 57.2 minutes, 49 of them in Playwright.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      RUN_POSTMAN: ${{ inputs.suites == 'all' || inputs.suites == 'postman' }}
      RUN_PLAYWRIGHT: ${{ inputs.suites == 'all' || inputs.suites == 'playwright' }}
      KEYCLOAK: ${{ inputs.compose_folder == 'with-keycloak' }}
    steps:
      - name: Check the inputs
        shell: bash
        env:
          SUITES: ${{ inputs.suites }}
          TIER: ${{ inputs.tier }}
          FOLDER: ${{ inputs.compose_folder }}
        run: |
          set -euo pipefail
          case "$SUITES" in all|postman|playwright) ;; *) echo "::error::suites must be all, postman, or playwright, not '$SUITES'"; exit 1 ;; esac
          case "$TIER" in full|smoke) ;; *) echo "::error::tier must be full or smoke, not '$TIER'"; exit 1 ;; esac
          case "$FOLDER" in apihub-generic|with-keycloak) ;; *) echo "::error::compose_folder must be apihub-generic or with-keycloak, not '$FOLDER'"; exit 1 ;; esac

      - uses: actions/checkout@v6

      # Before the install, so the lockfile check sees the suite that will run.
      - name: Take deploy/ and the suites from their refs
        shell: bash
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          POSTMAN_REF: ${{ inputs.postman_ref }}
          PLAYWRIGHT_REF: ${{ inputs.playwright_ref }}
        run: |
          set -euo pipefail
          bash tools/ci/overlay-ref.sh "$DEPLOY_REF" deploy
          bash tools/ci/overlay-ref.sh "$POSTMAN_REF" tests/postman-collections
          bash tools/ci/overlay-ref.sh "$PLAYWRIGHT_REF" tests/ui-tests

      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: e2e

      - name: Install podman and envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose gettext-base

      # The images may be private (upstream's are not).
      - name: Log in to ghcr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin

      # Staged in RUNNER_TEMP: the next steps write generated credentials into these files and repoint
      # the images. Every volume and env_file in docker-compose.yml is relative to this directory.
      - name: Stage the compose files
        shell: bash
        env:
          FOLDER: ${{ inputs.compose_folder }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/compose"
          cp -r "deploy/docker-compose/$FOLDER" "$RUNNER_TEMP/compose"
          # postgres bind-mounts ./data, which exists in the tree only through data/.gitkeep.
          [ -d "$RUNNER_TEMP/compose/data" ] || {
            echo "::error::deploy/docker-compose/$FOLDER/data is missing from the checkout"
            exit 1
          }
          ls -A "$RUNNER_TEMP/compose"

      # The repository's secrets when they are set, generated values for the rest; the same rules as
      # e2e-tests-kind.yml. The generated email must differ from the suite's sysadmin,
      # x_atui_sysadmin@qa.at: the backend creates this admin at startup with no name, the suite's
      # createSysadmin then gets "already exists" and never sets the name, and 14 Playwright assertions
      # on "published by" fail.
      - name: Take the stack's credentials
        shell: bash
        env:
          S_JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          S_ADMIN_EMAIL: ${{ secrets.APIHUB_ADMIN_EMAIL }}
          S_ADMIN_PASSWORD: ${{ secrets.APIHUB_ADMIN_PASSWORD }}
          S_ACCESS_TOKEN: ${{ secrets.APIHUB_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # openssl, not `tr -dc … </dev/urandom | head -c N`: under pipefail, tr dies of SIGPIPE and the
          # step exits 141 with no output.
          if [ -n "$S_JWT_PRIVATE_KEY" ]; then
            key="$S_JWT_PRIVATE_KEY"
            origin_key=secret
          else
            openssl genpkey -algorithm RSA -out rsakey.pem -pkeyopt rsa_keygen_bits:2048 2>/dev/null
            key="$(base64 -w0 rsakey.pem)"
            rm -f rsakey.pem
            origin_key=generated
          fi
          email="${S_ADMIN_EMAIL:-zero-day-admin@apihub.local}"
          pass="${S_ADMIN_PASSWORD:-$(openssl rand -hex 12)}"
          token="${S_ACCESS_TOKEN:-$(openssl rand -hex 30)}"
          if [ "$email" = 'x_atui_sysadmin@qa.at' ]; then
            echo "::error::APIHUB_ADMIN_EMAIL equals the Playwright suite's sysadmin address; use another address"
            exit 1
          fi
          # Masked: the password reaches Playwright, which is verbose on failure.
          echo "::add-mask::$key"
          echo "::add-mask::$pass"
          echo "::add-mask::$token"
          {
            echo "JWT_PRIVATE_KEY=$key"
            echo "APIHUB_ADMIN_EMAIL=$email"
            echo "APIHUB_ADMIN_PASSWORD=$pass"
            echo "APIHUB_ACCESS_TOKEN=$token"
          } >> "$GITHUB_ENV"
          src() { if [ -n "$1" ]; then echo secret; else echo generated; fi; }
          echo "credentials — JWT key: $origin_key, admin email: $(src "$S_ADMIN_EMAIL"), admin password: $(src "$S_ADMIN_PASSWORD"), access token: $(src "$S_ACCESS_TOKEN")"

      # What generate_env_and_up_compose.sh of the with-keycloak folder generates beyond the above:
      # the SAML signing pair (as PEM for the backend, as bare base64 for the realm), the OIDC client
      # secret, and the Keycloak user.
      - name: Generate the Keycloak credentials
        if: env.KEYCLOAK == 'true'
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -keyout "$RUNNER_TEMP/saml_key.pem" -out "$RUNNER_TEMP/saml_crt.pem" \
            -days 2 -nodes -subj "/CN=localhost" 2>/dev/null
          crt_pem="$(cat "$RUNNER_TEMP/saml_crt.pem")"
          key_pem="$(cat "$RUNNER_TEMP/saml_key.pem")"
          rm -f "$RUNNER_TEMP/saml_key.pem" "$RUNNER_TEMP/saml_crt.pem"
          saml_crt="$(echo -n "$crt_pem" | base64 -w0)"
          saml_key="$(echo -n "$key_pem" | base64 -w0)"
          saml_crt_kc="$(echo "$crt_pem" | sed '1d;$d' | tr -d '\n')"
          saml_key_kc="$(echo "$key_pem" | sed '1d;$d' | tr -d '\n')"
          oidc_secret="$(openssl rand -hex 16)"
          kc_user="$(openssl rand -hex 4)"
          kc_pass="$(openssl rand -hex 6)"
          for v in "$saml_crt" "$saml_key" "$saml_crt_kc" "$saml_key_kc" "$oidc_secret" "$kc_pass"; do
            echo "::add-mask::$v"
          done
          {
            echo "SAML_CRT=$saml_crt"
            echo "SAML_KEY=$saml_key"
            echo "SAML_CRT_KEYCLOAK=$saml_crt_kc"
            echo "SAML_KEY_KEYCLOAK=$saml_key_kc"
            echo "OIDC_CLIENT_SECRET=$oidc_secret"
            echo "APIHUB_USER_USERNAME=$kc_user"
            echo "APIHUB_USER_PASSWORD=$kc_pass"
          } >> "$GITHUB_ENV"

      - name: Template the env and config files
        shell: bash
        run: |
          set -euo pipefail
          # The stack reads only the files beside docker-compose.yml, and Keycloak's realm.
          cd "$RUNNER_TEMP/compose"
          find . \( -name '*.env' -o -name '*config.yaml' -o -path './keycloak/*.json' \) -print0 \
            | while IFS= read -r -d '' f; do
                envsubst < "$f" > "$f.tmp" && mv "$f.tmp" "$f"
              done

      # Points the five images at the tags of this run. Names and owner match what the compose file
      # names, so only the tag changes; the check below reads the result back.
      - name: Point the compose file at the image tags
        shell: bash
        env:
          IMAGE_TAGS: ${{ inputs.image_tags }}
          DEFAULT_TAG: ${{ inputs.default_image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"

          node tools/ci/e2e-image-tags.js > "$RUNNER_TEMP/tags.env"
          # shellcheck disable=SC1090
          source "$RUNNER_TEMP/tags.env"

          cd "$RUNNER_TEMP/compose"

          repoint() {  # $1 image name, $2 tag
            sed -i "s|image: ghcr.io/[^/]*/$1:[^[:space:]]*|image: ghcr.io/$owner/$1:$2|" docker-compose.yml
          }
          repoint qubership-apihub-backend              "$backend"
          repoint qubership-apihub-build-task-consumer  "$buildTaskConsumer"
          repoint qubership-apihub-ui                   "$ui"
          repoint qubership-api-linter-service          "$apiLinterService"
          repoint qubership-apihub-agents-backend       "$agentsBackend"

          # sed exits 0 whether it matched or not, so check that each image is what was asked for.
          grep -E '^\s*image:' docker-compose.yml | sed 's/^/  /'
          bad=0
          for want in \
            "ghcr.io/$owner/qubership-apihub-backend:$backend" \
            "ghcr.io/$owner/qubership-apihub-build-task-consumer:$buildTaskConsumer" \
            "ghcr.io/$owner/qubership-apihub-ui:$ui" \
            "ghcr.io/$owner/qubership-api-linter-service:$apiLinterService" \
            "ghcr.io/$owner/qubership-apihub-agents-backend:$agentsBackend"; do
            grep -Eq "^\s*image:\s*$want\s*$" docker-compose.yml || { echo "::error::not in the compose file: $want"; bad=1; }
          done
          [ "$bad" = 0 ] || exit 1

      - name: Bring the stack up
        run: |
          cd "$RUNNER_TEMP/compose"
          podman-compose -f docker-compose.yml up -d

      - name: Start collecting container logs
        run: |
          cd "$RUNNER_TEMP/compose"
          containers="qubership-apihub-backend postgres qubership-apihub-ui qubership-apihub-build-task-consumer qubership-api-linter-service qubership-apihub-agents-backend"
          [ "$KEYCLOAK" = 'true' ] && containers="$containers keycloak"
          for c in $containers; do
            podman logs -f "$c" > "$RUNNER_TEMP/compose/$c.log" 2>&1 &
          done

      - name: Wait for APIHUB to answer
        shell: bash
        run: |
          set -euo pipefail
          end=$((SECONDS + 300))
          while [ $SECONDS -lt $end ]; do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/login || true)"
            [ "$code" = "200" ] && { echo "up after ${SECONDS}s"; exit 0; }
            echo "  http $code, retrying"
            sleep 5
          done
          echo "::error::APIHUB did not answer 200 on /login within 5 minutes"
          podman ps -a
          exit 1

      - name: Run the postman collections
        id: newman
        if: env.RUN_POSTMAN == 'true'
        continue-on-error: true
        shell: bash
        env:
          COLLECTIONS: ${{ inputs.postman_collections }}
          TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail

          # The list, from tools/ci/e2e-collections.sh. The agent collections are left out: compose runs
          # no agent. Written before anything can fail, so the results check expects every report and
          # fails closed if this step dies early.
          bash tools/ci/e2e-collections.sh compose "$COLLECTIONS" "$TIER" false > "$RUNNER_TEMP/collections.txt"
          echo "collections=$(cut -d' ' -f1 "$RUNNER_TEMP/collections.txt" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

          npm install -g newman@6.2.3 newman-reporter-htmlextra@1.23.1

          # The environment goes to RUNNER_TEMP: it holds the generated password and token.
          env_file="$RUNNER_TEMP/ci.postman_environment.json"
          reports="$RUNNER_TEMP/newman-reports"
          mkdir -p "$reports"
          envsubst < tests/postman-collections/environment/local.postman_environment.json > "$env_file"

          # -x lets every collection run after one fails, so this step always succeeds. The next step
          # reads the JSON reports and decides.
          while read -r name file; do
            echo "=== $name ==="
            newman run "$file" \
              -e "$env_file" -x \
              --reporters cli,htmlextra,json \
              --reporter-htmlextra-export "$reports/${name}.html" \
              --reporter-json-export "$reports/${name}.json"
          done < "$RUNNER_TEMP/collections.txt"

      # Every expected collection must leave a JSON report with no failed assertion. A test that fails
      # for an unrelated reason is skipped in the collection, and this step reports every skip.
      - name: Check the postman results
        id: newman_results
        if: always() && env.RUN_POSTMAN == 'true'
        continue-on-error: true
        shell: bash
        run: |
          node tools/ci/newman-results-check.js \
            "$RUNNER_TEMP/newman-reports" '${{ steps.newman.outputs.collections }}'

      - name: Install Playwright browsers
        if: env.RUN_PLAYWRIGHT == 'true'
        working-directory: tests/ui-tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the Playwright suite
        id: playwright
        if: env.RUN_PLAYWRIGHT == 'true'
        continue-on-error: true
        working-directory: tests/ui-tests
        env:
          BASE_URL: http://localhost:8081
          TEST_USER_PASSWORD: ${{ env.APIHUB_ADMIN_PASSWORD }}
          PLAYGROUND_BACKEND_HOST: http://host.docker.internal:8081
          CLEAR_TD: skip
          PLAYWRIGHT_ARGS: ${{ inputs.playwright_args }}
          TIER: ${{ inputs.tier }}
        shell: bash
        run: |
          set -euo pipefail
          # --grep does not filter the setup projects, so a smoke run still creates its test data.
          # Tests that fail for unrelated reasons are skipped in their spec, not excluded here. The
          # arguments are split like a shell would, quotes included, without evaluating them.
          args="$PLAYWRIGHT_ARGS"
          [ -n "${args//[[:space:]]/}" ] || args='--project=Portal --grep-invert=@flaky'
          mapfile -t argv < <(xargs -n1 <<< "$args")
          if [ "$TIER" = 'smoke' ]; then argv+=(--grep=@smoke); fi
          echo "playwright ${argv[*]}"
          pnpm exec playwright test "${argv[@]}"

      # Three artifacts, so a reader downloads the 200 KB they need rather than 32 MB. Each runs
      # always(): the logs matter most on a failed run. retention-days is a sibling of path.
      # Prints the aria snapshots into the log too: an artifact is no use when the blob host is
      # unreachable, and a failed locator's log shows only what it waited for.
      - name: Page snapshots for the failures
        if: always() && steps.playwright.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r f; do
            found=$((found + 1))
            echo "::group::${f#tests/ui-tests/temp/test-results/}"
            cat "$f"
            echo "::endgroup::"
          done < <(find tests/ui-tests/temp/test-results -name 'error-context.md' 2>/dev/null | sort)
          echo "printed $found page snapshot(s)"

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: containers-logs
          path: ${{ runner.temp }}/compose/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Newman reports
        if: always() && env.RUN_POSTMAN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: newman-reports
          path: ${{ runner.temp }}/newman-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright reports
        if: always() && env.RUN_PLAYWRIGHT == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-reports
          # temp/test-results holds the screenshot, trace, and error-context.md of each failure.
          path: |
            tests/ui-tests/reports
            tests/ui-tests/temp/test-results
          if-no-files-found: warn
          retention-days: 7

      # Both suites run with continue-on-error, so a Playwright failure still leaves Newman's report
      # and the container logs. `newman` fails only if the install or newman itself breaks;
      # `newman_results` is the only step that sees a failed assertion. The job fails unless every
      # selected suite succeeded; a suite that was not selected has the outcome `skipped`.
      - name: Verdict
        if: always()
        shell: bash
        env:
          FOLDER: ${{ inputs.compose_folder }}
          TIER: ${{ inputs.tier }}
          SUITES: ${{ inputs.suites }}
        run: |
          set -euo pipefail
          newman='${{ steps.newman.outcome }}'
          results='${{ steps.newman_results.outcome }}'
          play='${{ steps.playwright.outcome }}'
          {
            echo '### E2E on Podman Compose'
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| stack | \`$FOLDER\` |"
            echo "| tier, suites | \`$TIER\`, \`$SUITES\` |"
            echo "| postman collections, run | \`$newman\` |"
            echo "| postman collections, results | \`$results\` |"
            echo "| playwright | \`$play\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          ok=1
          if [ "$RUN_POSTMAN" = 'true' ]; then
            [ "$newman" = 'success' ] && [ "$results" = 'success' ] || ok=0
          fi
          if [ "$RUN_PLAYWRIGHT" = 'true' ]; then
            [ "$play" = 'success' ] || ok=0
          fi
          [ "$ok" = 1 ] || {
            echo "::error::newman=$newman newman_results=$results playwright=$play"
            exit 1
          }
