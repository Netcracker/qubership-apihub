'on':
  push:
    # '**' rather than no filter: a bare `push:` also fires on the tags release-finish.yml pushes.
    branches: ['**']
  pull_request:
    # No paths-ignore: `ci-ok` is the required check, and a skipped workflow never reports it, so a
    # documentation-only pull request would wait for it forever. The `plan` job gives such a pull
    # request no E2E tier instead.
    types: [opened, reopened, synchronize]
  # The release bots push with a deploy key, and those pushes start CI by themselves;
  # tools/release/ensure-ci.sh dispatches it only when a push started no run. release_dry_run previews
  # the release-artifacts job of the commit (or of its nearest release) without publishing anything.
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: 'Preview the release artifacts (image version tags, npm packages, GitHub Releases); publish nothing.'
        type: boolean
        default: false

name: CI

# One run per ref; a newer push cancels the older run, except on main and release: a run there publishes
# images, and on main the release artifacts, so it is never cancelled half-way. Those runs queue instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release' }}

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  # Computes the affected set once and passes it to the other jobs as JSON.
  plan:
    runs-on: ubuntu-latest
    # pull-requests: read, to find an open pull request for the E2E tier.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      screenshot_projects: ${{ steps.affected.outputs.screenshot_projects }}
      image_projects: ${{ steps.affected.outputs.image_projects }}
      go_projects: ${{ steps.affected.outputs.go_projects }}
      java_projects: ${{ steps.affected.outputs.java_projects }}
      branch_tag: ${{ steps.tags.outputs.branch_tag }}
      e2e_tier: ${{ steps.e2e_tier.outputs.value }}
      storybooks: ${{ steps.storybooks.outputs.value }}
      can_publish: ${{ steps.can_publish.outputs.value }}
      release_tags: ${{ steps.release_tags.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          # nx affected needs history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      # Base: the merge base for a pull request, the last successful develop run for a push.
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: develop

      - id: affected
        shell: bash
        run: |
          set -euo pipefail
          affected="$(pnpm exec nx show projects --affected --json)"
          echo "affected: $affected"

          # Keeps the candidates that are affected. A matrix over an empty array is skipped.
          pick() {
            node -e '
              const affected = new Set(JSON.parse(process.argv[1]))
              const candidates = process.argv.slice(2)
              console.log(JSON.stringify(candidates.filter((c) => affected.has(c))))
            ' "$affected" "${@}"
          }

          shots="$(pick api-doc-viewer apispec-view class-view)"

          # The Go set comes from the lang:go tag, never a list. `nx affected` does not accept
          # --projects: it passes the flag to the task (`malformed import path "--projects=tag:lang:go"`).
          go_all="$(pnpm exec nx show projects --projects=tag:lang:go --json)"
          # shellcheck disable=SC2046 # word splitting turns the project list into arguments
          go="$(pick $(node -e 'console.log(JSON.parse(process.argv[1]).join(" "))' "$go_all"))"

          # The Java reactor has a short-named parent project and three inferred Maven projects, which
          # @nx/maven names <groupId>:<artifactId>: the root pom (qubership-apihub-monorepo) and the two
          # modules. Any of them affected runs the Java job, which builds the whole reactor with
          # `nx run java-task-consumer:build`.
          java="$(pick java-task-consumer \
            com.netcracker.qubership.apihub:qubership-apihub-monorepo \
            com.netcracker.qubership.apihub:java-task-consumer \
            com.netcracker.qubership.apihub:jdiff-engine)"

          # Images are not selected by `affected`: whether a branch tag points at the right image is a
          # question about the registry. The images job retags when the content already exists. The diff
          # below only feeds the summary.
          images='["ui-portal","build-task-consumer","agent","test-service","agents-backend","api-linter-service","portal-backend","java-task-consumer"]'
          image_inputs="$(git diff --name-only "$NX_BASE" "$NX_HEAD" -- \
            .dockerignore tools/ci .github/workflows/ci.yml .github/actions || true)"

          echo "screenshot_projects=$shots" >> "$GITHUB_OUTPUT"
          echo "image_projects=$images"     >> "$GITHUB_OUTPUT"
          echo "go_projects=$go"          >> "$GITHUB_OUTPUT"
          echo "java_projects=$java"      >> "$GITHUB_OUTPUT"

          # A Mermaid summary of the affected set: a skipped job looks the same whether the skip was
          # correct or not.
          pnpm exec nx graph --file=plan-graph.json >/dev/null
          node tools/ci/plan-summary.js plan-graph.json \
            "$affected" "$shots" "$images" "$image_inputs" "$go" >> "$GITHUB_STEP_SUMMARY"
          rm -f plan-graph.json

      # The Storybooks to publish, from tools/ci/storybooks.json. Not selected by `affected`, for the
      # images' reason.
      - name: Storybooks to publish
        id: storybooks
        shell: bash
        run: echo "value=$(jq -c . tools/ci/storybooks.json)" >> "$GITHUB_OUTPUT"

      # The tag this ref's images carry (tools/ci/branch-tag.sh, the same script images.yml uses); E2E
      # pulls the stack by it.
      - name: Branch tag
        id: tags
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: echo "branch_tag=$(bash tools/ci/branch-tag.sh "$REF")" >> "$GITHUB_OUTPUT"

      # Does this commit carry release tags (`<component>/X.Y.Z` or the bare product `X.Y.Z`, pushed by
      # release-finish.yml)? Decides whether release-artifacts runs on main.
      - name: Release tags at this commit
        id: release_tags
        shell: bash
        run: |
          set -euo pipefail
          tags="$(git tag --points-at HEAD | grep -E '(^|/)[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          if [ -n "$tags" ]; then value=true; else value=false; fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "release tags at HEAD: ${tags:-none}" | tr '\n' ' '

      # Can this run write to ghcr? A pull request from a fork and every Dependabot run get a read-only
      # token and no secrets, so the image, E2E and Storybook jobs are skipped there, and
      # tools/ci/ci-verdict.js accepts exactly those skips when this output is `false`.
      - name: Can this run publish
        id: can_publish
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          value=true
          if [ "$EVENT" = 'pull_request' ] && [ "$HEAD_REPO" != "$REPO" ]; then
            value=false
          elif [ "$ACTOR" = 'dependabot[bot]' ]; then
            value=false
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "can publish: $value"

      # The E2E tier, decided once so a push and its pull request do not both run E2E:
      #   pull_request event          full, none if only docs/ or Markdown files changed
      #   push to release             full, always: the release candidate gets the whole suite
      #   push, an open PR exists     none: the pull_request run covers this commit
      #   push, no open PR            none; smoke is disabled below
      - name: Decide the E2E tier
        id: e2e_tier
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = 'pull_request' ]; then
            # NX_BASE and NX_HEAD come from nrwl/nx-set-shas: the merge base and this commit.
            code_changes="$(git diff --name-only "$NX_BASE" "$NX_HEAD" | grep -vE '^docs/|\.md$' || true)"
            if [ -z "$code_changes" ]; then
              tier=none
              why='pull_request event, but only docs/ or Markdown files changed'
            else
              tier=full
              why='pull_request event'
            fi
          elif [ "$REF" = 'refs/heads/release' ]; then
            tier=full
            why='push to release — the full suite runs on every push to release'
          else
            open="$(gh api --method GET "repos/$REPO/pulls" \
              -f head="$OWNER:$REF_NAME" -f state=open --jq 'length')"
            if [ "$open" -gt 0 ]; then
              tier=none
              why="push, but $open open pull request(s) — the pull_request run does the full suite"
            else
              # Smoke is disabled pending a review of its content: it cost 26 of the 44 minutes of a
              # full run for half the Playwright tests. Uncommenting the next line re-enables it.
              # tier=smoke
              tier=none
              why='push with no open pull request — E2E runs on pull requests only'
            fi
          fi
          echo "value=$tier" >> "$GITHUB_OUTPUT"
          echo "e2e tier: $tier ($why)"
          echo "| e2e | \`$tier\` | $why |" >> "$GITHUB_STEP_SUMMARY"

      # The same cache summary in every job, from tools/ci/cache-summary.sh; always(), because a failed
      # job needs it most.
      - name: cache summary
        if: always()
        run: bash tools/ci/cache-summary.sh 'plan' >> "$GITHUB_STEP_SUMMARY"

  # Builds and tests the affected JavaScript projects in one job: Nx parallelizes them in
  # topological order on one runner, with no artifacts passed between jobs.
  js:
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: develop

      # The release and CI scripts are no Nx project, so nx affected never tests them. Among them, the
      # ci-verdict tests check that ci-ok needs every job of this file.
      - name: test the release and CI tools
        run: pnpm test:tools

      # build and test together: otherwise test-only dependencies are never exercised. Go and Maven
      # projects have their own jobs; the Maven projects carry the `maven:<groupId>` tag, which the
      # parent project java-task-consumer shares.
      - name: build and test what is affected
        run: |
          # pipefail: tee alone would return 0.
          set -o pipefail
          pnpm exec nx affected -t build test \
            --exclude='tag:lang:go,tag:maven:com.netcracker.qubership.apihub' --verbose 2>&1 \
            | tee "$RUNNER_TEMP/nx.log"

      - name: cache summary
        if: always()
        run: bash tools/ci/cache-summary.sh 'js' "$RUNNER_TEMP/nx.log" >> "$GITHUB_STEP_SUMMARY"


  # The Go consistency checks, on every run whatever is affected: a drifted version or go.mod breaks the
  # images, which build each module alone, and no affected-based job would notice. They need Go and
  # bash, not the pnpm workspace, so this job skips setup-workspace.
  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # The one Go version, from backend/.go-version.
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/.go-version
          cache-dependency-path: |
            backend/**/go.sum
            go.work.sum

      # With GOTOOLCHAIN=auto, a module that declares another Go version downloads it and builds green.
      - name: every Go module on the same version
        shell: bash
        run: |
          printf '### Go version\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          bash tools/ci/go-version-check.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

      # The workspace build cannot see this: images build each module alone with GOWORK=off, so every
      # go.mod must hold the versions go.work resolves.
      - name: every go.mod states what the workspace resolves
        shell: bash
        run: |
          printf '### Go workspace sync\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          bash tools/ci/go-work-sync-check.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

  # Lints the product chart and the agent chart and validates what they render against the Kubernetes
  # schemas: the check release-artifacts runs on the pinned copies before it publishes them. On every
  # run, as it takes under a minute.
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: lint and validate the Helm charts
        shell: bash
        run: |
          bash tools/ci/chart-check.sh \
            deploy/helm-templates/qubership-apihub \
            backend/agent/helm-templates/qubership-apihub-agent

  # Builds and tests the affected Go modules in one job, in parallel with `js`. Skipped when no Go
  # module is affected: `nx run-many` over an empty list exits 0, which looks like a pass.
  go:
    needs: [plan]
    if: needs.plan.outputs.go_projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      # The one Go version, from backend/.go-version. The module cache keys on the go.sum files.
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/.go-version
          cache-dependency-path: |
            backend/**/go.sum
            go.work.sum

      # build and test together, so test-only imports are resolved. The version and workspace checks
      # are the `go-checks` job, which runs on every change.
      - name: build and test what is affected
        shell: bash
        env:
          GO_PROJECTS: ${{ needs.plan.outputs.go_projects }}
        run: |
          # pipefail: tee alone would return 0.
          set -o pipefail
          projects="$(node -e 'console.log(JSON.parse(process.argv[1]).join(","))' "$GO_PROJECTS")"
          echo "go projects: $projects"
          pnpm exec nx run-many -t build test --projects="$projects" --verbose 2>&1 \
            | tee "$RUNNER_TEMP/nx.log"

      # Checks the binaries, not the exit code: the build exits 0 on an empty project list and when
      # `go build ./...` matches no package. commons-go declares `outputs: []`, so it is exempt.
      - name: the binaries exist
        shell: bash
        env:
          GO_PROJECTS: ${{ needs.plan.outputs.go_projects }}
        run: |
          set -euo pipefail
          projects="$(node -e 'console.log(JSON.parse(process.argv[1]).join(","))' "$GO_PROJECTS")"
          pnpm exec nx graph --file=go-graph.json >/dev/null
          printf '### Go binaries\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          node tools/ci/go-artifacts-check.js go-graph.json "$projects" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          rm -f go-graph.json
          exit "${status:-0}"
      - name: cache summary
        if: always()
        run: bash tools/ci/cache-summary.sh 'go' "$RUNNER_TEMP/nx.log" >> "$GITHUB_STEP_SUMMARY"

  # Builds and tests the Java reactor (jdiff-engine and java-task-consumer) with `mvn verify`, through
  # the Nx `build` target of the parent project. Java 21 and Maven 3.9 come from setup-workspace.
  # Skipped when no Java project is affected. Maven needs no MAVEN_HOME on a Linux runner.
  java:
    needs: [plan]
    if: needs.plan.outputs.java_projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-workspace

      - name: build and test the Java reactor
        shell: bash
        run: |
          # pipefail: tee alone would return 0.
          set -o pipefail
          pnpm exec nx run java-task-consumer:build --verbose 2>&1 | tee "$RUNNER_TEMP/nx.log"

      # The jar the image copies: check the file itself, as the images job does before its build.
      - name: the jar exists
        shell: bash
        run: |
          set -euo pipefail
          ls -l backend/java-task-consumer/java-task-consumer/target/java-task-consumer-*.jar

      - name: cache summary
        if: always()
        run: bash tools/ci/cache-summary.sh 'java' "$RUNNER_TEMP/nx.log" >> "$GITHUB_STEP_SUMMARY"

      - name: upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/java-task-consumer/*/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14

  # The only real test coverage api-doc-viewer, apispec-view, and class-view have. Each suite builds
  # its Storybook, serves it, and drives Chrome in a container through jest. It does not wait for
  # `js`: `screenshot-test` depends on `build` and `^build`, so a broken build fails here.
  # Gap G24: the library build and the showcase build need opposite externals settings, and both
  # exit 0 when wrong. Do not unify their configs.
  screenshot-tests:
    needs: [plan]
    if: needs.plan.outputs.screenshot_projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.screenshot_projects) }}
    steps:
      - uses: actions/checkout@v6

      # Each leg caches its own closure; a shared key lets one leg's cache overwrite the others.
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: screenshot-${{ matrix.project }}

      - name: build showcase and run the suite
        run: |
          set -o pipefail
          pnpm exec nx run ${{ matrix.project }}:screenshot-test 2>&1 | tee "$RUNNER_TEMP/nx.log"

      - name: cache summary
        if: always()
        run: bash tools/ci/cache-summary.sh 'screenshot-tests (${{ matrix.project }})' "$RUNNER_TEMP/nx.log" >> "$GITHUB_STEP_SUMMARY"

      # Uploads the PNG diffs of a failed suite, searched only under this project: another
      # component's committed __diff_output__ files would look like this suite's failure.
      - name: collect diffs
        if: failure()
        run: |
          set -euo pipefail
          root="$(pnpm exec nx show project '${{ matrix.project }}' --json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).root')"
          echo "collecting under: $root"
          mkdir -p artifact-staging
          find "$root" -path '*/__diff_output__/*' -type f -not -path '*/node_modules/*' \
            -exec cp {} artifact-staging/ \; 2>/dev/null || true
          echo "collected $(find artifact-staging -type f | wc -l) diff file(s) for ${{ matrix.project }}"

      - name: upload diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs-${{ matrix.project }}
          path: artifact-staging
          if-no-files-found: ignore
          retention-days: 14

  # Images publish floating tags that others pull, so each language's images wait for its tests.
  # All three call images.yml. The names are the ones the product has always used (assumption A2);
  # the registry owner is the repository owner, netcracker.
  js-images:
    needs: [plan, js]
    # `js` never skips, so the implicit check that every need succeeded is enough.
    if: needs.plan.outputs.image_projects != '[]' && needs.plan.outputs.can_publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      images: >-
        [{"project":"ui-portal","image":"qubership-apihub-ui","dockerfile":"frontend/ui/Dockerfile",
          "build_projects":"ui-portal,ui-agents","deploy":"","context":".","dockerignore":".dockerignore",
          "workspace_build":"true","outputs":""},
         {"project":"build-task-consumer","image":"qubership-apihub-build-task-consumer",
          "dockerfile":"frontend/build-task-consumer/Dockerfile",
          "build_projects":"build-task-consumer","deploy":"build-task-consumer","context":".","dockerignore":".dockerignore",
          "workspace_build":"true","outputs":""}]

  go-images:
    needs: [plan, go-checks, go]
    # `go` is skipped when no Go module is affected, and a skipped need fails the implicit check.
    # Images must still run, so a skipped `go` passes here and a failed or cancelled one does not.
    # `go-checks` never skips: a drifted Go version or go.mod would break the per-module image builds.
    if: >-
      always()
      && needs.plan.result == 'success'
      && needs.go-checks.result == 'success'
      && needs.go.result != 'failure' && needs.go.result != 'cancelled'
      && needs.plan.outputs.image_projects != '[]'
      && needs.plan.outputs.can_publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      images: >-
        [{"project":"agent","image":"qubership-apihub-agent","dockerfile":"backend/agent/Dockerfile",
          "build_projects":"agent","deploy":"","context":"backend/agent","dockerignore":".dockerignore backend/agent/.dockerignore",
          "workspace_build":"false","outputs":""},
         {"project":"test-service","image":"qubership-apihub-test-service",
          "dockerfile":"backend/test-service/Dockerfile","build_projects":"test-service",
          "deploy":"","context":"backend/test-service","dockerignore":".dockerignore backend/test-service/.dockerignore",
          "workspace_build":"false","outputs":""},
         {"project":"agents-backend","image":"qubership-apihub-agents-backend",
          "dockerfile":"backend/agents-backend/Dockerfile",
          "build_projects":"agents-backend,commons-go","deploy":"","context":"backend",
          "dockerignore":".dockerignore backend/.dockerignore","workspace_build":"false","outputs":""},
         {"project":"api-linter-service","image":"qubership-api-linter-service",
          "dockerfile":"backend/api-linter-service/Dockerfile",
          "build_projects":"api-linter-service,commons-go","deploy":"","context":"backend",
          "dockerignore":".dockerignore backend/.dockerignore","workspace_build":"false","outputs":""},
         {"project":"portal-backend","image":"qubership-apihub-backend",
          "dockerfile":"backend/portal-backend/Dockerfile",
          "build_projects":"portal-backend,commons-go","deploy":"","context":"backend",
          "dockerignore":".dockerignore backend/.dockerignore","workspace_build":"false","outputs":""}]

  # The Java image copies the shaded jar that `mvn verify` writes, so its leg runs the Nx build first
  # (workspace_build) and checks the jar. The Dockerfile's context is the Maven parent directory.
  java-images:
    needs: [plan, java]
    # `java` is skipped when no Java project is affected, as `go` is.
    if: >-
      always()
      && needs.plan.result == 'success'
      && needs.java.result != 'failure' && needs.java.result != 'cancelled'
      && needs.plan.outputs.image_projects != '[]'
      && needs.plan.outputs.can_publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      images: >-
        [{"project":"java-task-consumer","image":"qubership-apihub-java-task-consumer",
          "dockerfile":"backend/java-task-consumer/Dockerfile","build_projects":"java-task-consumer",
          "deploy":"","context":"backend/java-task-consumer","dockerignore":"",
          "workspace_build":"true",
          "outputs":"backend/java-task-consumer/java-task-consumer/target/java-task-consumer-*.jar"}]

  # E2E on Kind from the Helm charts, with this run's images, at the branch tag. e2e-tests-compose.yml
  # takes the same inputs (plus the compose folder), so switching to compose means changing the `uses:`
  # line. The repository's E2E secrets are passed on; a run without them (a pull request from a fork)
  # generates its own credentials. The Java image is not part of the product chart, so E2E does not
  # wait for it.
  e2e:
    needs: [plan, js-images, go-images]
    # `always()` because go-images has its own always() condition and a skipped need would skip this
    # job too; the results are read explicitly.
    if: >-
      always()
      && needs.plan.outputs.e2e_tier != 'none'
      && needs.plan.outputs.can_publish == 'true'
      && needs.js-images.result == 'success'
      && needs.go-images.result == 'success'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-tests-kind.yml
    secrets: inherit
    with:
      default_image_tag: ${{ needs.plan.outputs.branch_tag }}
      tier: ${{ needs.plan.outputs.e2e_tier }}

  # Stores each Storybook in ghcr as an OCI artifact keyed by content hash and gives this branch a
  # pointer to it (tools/ci/storybook-store.sh); pages.yml assembles the site from the store. All
  # six run on every push, for the images' reason, and build only new content. Not run for pull
  # requests, whose ref is no branch. Not gated on tests: a red branch's Storybook shows what is red.
  storybooks:
    needs: [plan]
    if: github.event_name != 'pull_request' && needs.plan.outputs.can_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # From tools/ci/storybooks.json, which pages.yml also reads.
        include: ${{ fromJSON(needs.plan.outputs.storybooks) }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: storybook-${{ matrix.component }}

      # 1.3.3, not the current 1.3.4: setup-oras verifies against a release table baked into
      # the action, and v2.0.1's ends at 1.3.3.
      - uses: oras-project/setup-oras@v2.0.1
        with:
          version: 1.3.3

      - name: log in to ghcr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | oras login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: build the Storybook if its content is new, then point this branch at it
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          PROJECT: ${{ matrix.project }}
          HASH_PROJECTS: ${{ matrix.hash_projects }}
          HASH_PATHS: ${{ matrix.hash_paths }}
          OUTPUT: ${{ matrix.output }}
          OWNER: ${{ github.repository_owner }}
        run: bash tools/ci/storybook-store.sh

      - name: cache summary
        if: always()
        run: bash tools/ci/cache-summary.sh 'storybooks (${{ matrix.component }})' "$RUNNER_TEMP/nx.log" >> "$GITHUB_STEP_SUMMARY"

  # Dispatches pages.yml at the default branch. A separate workflow, because Pages deploys queue in
  # one group for all branches, while this workflow's group is per ref and cancels. `always()`, so
  # one failed Storybook does not keep the others off the site. Warns and skips if pages.yml is not
  # on the default branch, where workflow_dispatch requires it.
  storybook-pages:
    needs: [storybooks]
    # Nothing deploys the site until the PAGES_DEPLOY variable is true, so no run is dispatched before.
    if: >-
      always() && github.event_name != 'pull_request' && needs.storybooks.result != 'skipped'
      && vars.PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: dispatch pages.yml
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          default='${{ github.event.repository.default_branch }}'
          if ! gh api "repos/$repo/contents/.github/workflows/pages.yml?ref=$default" --silent 2>/dev/null; then
            msg="pages.yml is not on $default yet, so it cannot be dispatched; the store was updated and the site was not"
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run pages.yml --repo "$repo" --ref "$default" \
            -f reason="CI on $REF_NAME, run $RUN_ID"
          echo "dispatched pages.yml at \`$default\`" | tee -a "$GITHUB_STEP_SUMMARY"


  # The only required check. It always runs, so affected-based skipping cannot leave a pull request
  # waiting for a check that never reports. It fails if any job failed or was cancelled, and also if a
  # job that had to run was skipped: tools/ci/ci-verdict.js derives from the plan which jobs those
  # are. A skip is accepted only where the plan says nothing is affected (go, java, screenshot-tests),
  # where E2E is not due (tier none), where the run is a pull request (storybooks), or where the run
  # cannot publish (can_publish false: images, e2e, storybooks), or where PAGES_DEPLOY is not true
  # (storybook-pages).
  ci-ok:
    needs:
      - plan
      - js
      - go-checks
      - charts
      - go
      - java
      - screenshot-tests
      - js-images
      - go-images
      - java-images
      - e2e
      - storybooks
      - storybook-pages
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: tools/ci

      - name: verdict
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          PAGES_DEPLOY: ${{ vars.PAGES_DEPLOY }}
        run: node tools/ci/ci-verdict.js | tee -a "$GITHUB_STEP_SUMMARY"

  # Publishes a release on main after ci-ok passes, when the commit carries the tags release-finish.yml
  # pushed: image version tags from this run's images, npm packages, GitHub Releases
  # (.github/workflows/release-artifacts.yml). Both jobs run after the verdict and are not in its needs,
  # so they never decide ci-ok, on main or anywhere else. `always()`: a skipped job upstream of ci-ok
  # would otherwise skip these too, even on a green run.
  release-artifacts:
    needs: [plan, ci-ok]
    if: >-
      always()
      && needs.ci-ok.result == 'success'
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.plan.outputs.release_tags == 'true'
      && inputs.release_dry_run != true
    permissions:
      contents: write # create the GitHub Releases
      packages: write # image version tags and npm packages in ghcr
      pull-requests: read # release notes: the pull requests of the changes
      issues: read # release notes: the issues those pull requests close
    uses: ./.github/workflows/release-artifacts.yml
    with:
      dry_run: false
    secrets:
      PROJECT_READ_TOKEN: ${{ secrets.PROJECT_READ_TOKEN }}

  # The same, publishing nothing, on any branch: dispatch CI with release_dry_run. After ci-ok, so the
  # images of the run exist, but not gated on it: a preview is useful on a red run too.
  release-artifacts-dry-run:
    needs: [plan, ci-ok]
    if: >-
      always()
      && needs.plan.result == 'success'
      && github.event_name == 'workflow_dispatch'
      && inputs.release_dry_run == true
    permissions:
      contents: read
      packages: read
      pull-requests: read
      issues: read
    uses: ./.github/workflows/release-artifacts.yml
    with:
      dry_run: true
    secrets:
      PROJECT_READ_TOKEN: ${{ secrets.PROJECT_READ_TOKEN }}
