---

# The workflow template for automatic PR labeler.
# It applies two kinds of labels:
#   - conventional-commit labels (fix, feature, docs, and so on) from .github/auto-labeler-config.yaml;
#   - module labels (`module:<name>`) from the changed paths, from .github/labeler.yml.
# Example of the conventional-commits file can be found there:
# https://github.com/Netcracker/.github/blob/main/config/examples/auto-labeler-config.yaml

name: Automatic PR Labeler

on:
  pull_request:
    # develop is the default branch, release and main are the other long-lived branches (see release-process.md).
    branches: [main, develop, release]
    types:
      [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  assign-labels:
    if: (github.event.pull_request.merged == false) && (github.event.pull_request.user.login != 'dependabot[bot]') && (github.event.pull_request.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Assign module labels by changed paths"
        # A token of a pull request from a fork is read-only, so labels are not applied there.
        if: ${{ github.event.pull_request.base.repo.id == github.event.pull_request.head.repo.id }}
        uses: actions/labeler@v5
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          # Labels set by hand or by the step below stay as they are.
          sync-labels: false

      - name: "Execute assign labels"
        id: action-assign-labels
        uses: mauroalderete/action-assign-labels@v1
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          conventional-commits: "./.github/auto-labeler-config.yaml"
          maintain-labels-not-matched: true
          apply-changes: ${{ github.event.pull_request.base.repo.id == github.event.pull_request.head.repo.id }}
      - name: "Drop warning if PR from fork"
        if: ${{ github.event.pull_request.base.repo.id != github.event.pull_request.head.repo.id }}
        run: |
          {
            echo "Warning: pull request from a fork.";
            echo "Labels will not be applied to PR. Assign them manually please.";
            echo "Labels to assign: ${{ steps.action-assign-labels.outputs.labels-next }}";
          } >> "$GITHUB_STEP_SUMMARY"
