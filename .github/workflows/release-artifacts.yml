name: Release artifacts

# Publishes a release that release-finish.yml pushed to main: the tags at the commit say what was released
# (tools/release/artifacts.js). In this order, so every link in the notes exists when a release appears:
#   1. point <image>:<version> at the multi-arch image this CI run published under the branch tag;
#   2. build the released npm packages (before any login) and `pnpm publish -r` them; a version that the
#      registry already holds from before the release stops a real run;
#   3. package the released Helm charts with every image tag pinned and push them to
#      oci://ghcr.io/<owner>/charts: the product chart with the product tag, the agent chart with the agent;
#   4. create the GitHub Releases, modules with make_latest=false, then the product as Latest; a release
#      with a chart carries its .tgz.
# The notes (tools/release/notes/) are written in the plan step: the job token reads the pull requests and
# issues of the changes, PROJECT_READ_TOKEN the sprint's work items on Project 9. Without that secret the
# plan reports a problem: a real run stops at the check, a dry run warns.
#
# ci.yml calls it twice: from release-artifacts on main (dry_run false, write permissions) and from
# release-artifacts-dry-run on a dispatch with release_dry_run (read permissions). A dry run publishes
# nothing; it reads the registries and GitHub and writes what it would do to the job summary. On a commit
# without release tags it previews the nearest ancestor with a product tag.
#
# The caller sets the permissions; this workflow asks for none of its own.

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Publish nothing; report what would be published.'
        type: boolean
        required: true
    secrets:
      PROJECT_READ_TOKEN:
        description: 'Token with read:project for the Project 9 work items of the product notes.'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      REF: ${{ github.ref }}
      SHA: ${{ github.sha }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The tags and their history: the notes list the commits since each previous tag.
          fetch-depth: 0
          # The job token can create releases; nothing here fetches or pushes, and gh reads GH_TOKEN.
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: release-artifacts

      - name: Plan the release artifacts
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # Only this step sees the tokens of the notes.
          GH_TOKEN: ${{ github.token }}
          PROJECT_READ_TOKEN: ${{ secrets.PROJECT_READ_TOKEN }}
        run: |
          set -euo pipefail
          # Outside the checkout, so nothing of the plan can reach a package or a build context.
          echo "PLAN=$RUNNER_TEMP/release/plan.json" >> "$GITHUB_ENV"
          nearest=()
          if [ "$DRY_RUN" = 'true' ]; then nearest=(--nearest); fi
          node tools/release/artifacts.js --out "$RUNNER_TEMP/release" "${nearest[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the plan
        shell: bash
        run: bash tools/release/publish-artifacts.sh check

      # Before any registry login: the build runs repository code, which must not find a token on disk.
      - name: Build the npm packages
        shell: bash
        run: bash tools/release/publish-artifacts.sh build

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the image version tags at this run's images
        shell: bash
        run: bash tools/release/publish-artifacts.sh images

      # The token goes in ~/.npmrc, outside the repository and every docker build context.
      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> "$HOME/.npmrc"
          git diff --exit-code --stat .npmrc

      - name: Publish the npm packages
        shell: bash
        run: bash tools/release/publish-artifacts.sh npm

      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      # The token goes in Helm's registry config under ~/.config, outside the repository.
      - name: Log in to the chart registry
        shell: bash
        env:
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$HELM_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      # Version and appVersion from the release, every image tag pinned (tools/release/charts.js); the
      # chart sources in git keep their defaults.
      - name: Publish the Helm charts
        shell: bash
        run: bash tools/release/publish-artifacts.sh charts

      - name: Create the GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/release/publish-artifacts.sh releases
