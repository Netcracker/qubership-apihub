openapi: 3.0.3
info:
  title: APIHUB Agent Admin Internal API
  version: 1.0.0
  description: |
    Internal-only API contract for system administrators managing the APIHUB Agent.
    Covers cloud-wide discovery orchestration and namespace/service summary retrieval scoped by workspace.
    Intended for trusted operators within the deployment network; not exposed to external API consumers.
    Authentication uses APIHUB bearer token, API key, or session cookie.
  contact:
    name: Netcracker Opensource Group
    email: opensourcegroup@netcracker.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-api-kind: no-BWC
servers:
  - url: "https://{agentUrl}/api"
    description: Base URL of the Agent backend API (replace {agentUrl} with the agent host, for example agent.local or localhost:8080).
    variables:
      agentUrl:
        default: localhost
        description: >-
          Agent backend host without scheme or path. Accepted formats: hostname (agent.my-cluster.svc),
          hostname:port (localhost:8080), or FQDN. Do not include https:// or /api.
          Illustrative pattern: ^[A-Za-z0-9._-]+(?::[0-9]{1,5})?$
security:
  - BearerAuth: []
  - ApiKeyAuth: []
  - CookieAuth: []
tags:
  - name: Cloud Services
    description: Cloud-wide discovery and service inventory endpoints, including deprecated discover operations and workspace-scoped namespace summaries.
paths:
  /v1/discover:
    post:
      summary: Run discover for whole cloud
      description: >-
        Starts asynchronous API discovery across all namespaces in the cloud.
        Returns 202 Accepted with an empty body when the request is accepted (no job identifier or Location header).
        Poll GET /v1/services for cloud-wide discovery status.
        If discovery is already running, the call is accepted without starting a parallel run.
        Requires authenticated administrator access.
      operationId: postCloudDiscover
      deprecated: true
      x-deprecation-reason: New version of API is created - POST /v2/workspaces/{workspaceId}/discover
      tags:
        - Cloud Services
      responses:
        "202":
          description: Success
          content: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples: {}
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"
  /v2/workspaces/{workspaceId}/discover:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      summary: Run discover for whole cloud
      description: >-
        Starts asynchronous cloud-wide discovery for the workspace in the path.
        Returns 202 Accepted with an empty body when accepted (no job identifier or Location header).
        Poll GET /v2/workspaces/{workspaceId}/services for status.
        If discovery is already running, the call is accepted without starting a parallel run.
        Requires authenticated administrator access.
      operationId: postCloudDiscoverV2
      deprecated: true
      x-deprecation-reason: Prefer POST /v2/namespaces/{name}/workspaces/{workspaceId}/discover on the Agent API.
      tags:
        - Cloud Services
      responses:
        "202":
          description: Success
          content: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples: {}
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"
  /v1/services:
    get:
      summary: Get namespaces summary for the whole cloud
      description: >-
        Returns a cloud-wide discovery summary: process status (none, running, complete, error),
        progress and timing metrics, aggregate counts (namespaces, services, baselines, documents),
        and per-namespace service lists with discovered specs.
        Read-only; does not start discovery. Requires authenticated administrator access.
        Deprecated; use GET /v2/workspaces/{workspaceId}/services instead.
      operationId: getCloudNamespaces
      deprecated: true
      x-deprecation-reason: New version of API is created - GET /v2/workspaces/{workspaceId}/services
      tags:
        - Cloud Services
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: Overall status of the discovery process
                    type: string
                    enum:
                      - none
                      - running
                      - complete
                      - error
                  progress:
                    description: Total number of namespaces / Number of discovered namespaces
                    type: number
                  elapsedSec:
                    description: Time spent (in sec)
                    type: number
                  totalNamespaces:
                    description: Total number of discovered cloud namespaces
                    type: number
                  totalServices:
                    description: Total number of discovered cloud services
                    type: number
                  totalServicesWithBaselines:
                    description: Total number of discovered cloud services with baseline
                    type: number
                  totalDocuments:
                    description: Total number of documents
                    type: number
                  namespaceData:
                    type: object
                    properties:
                      namespace:
                        description: Discovered namespaces
                        type: object
                        properties:
                          services:
                            description: The list of found services
                            type: array
                            items:
                              $ref: "#/components/schemas/ServiceV1"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples: {}
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"
  /v2/workspaces/{workspaceId}/services:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Get namespaces summary for the whole cloud
      description: >-
        Returns a cloud-wide discovery summary for the given workspace: process status,
        progress and timing metrics, aggregate counts, and namespaceData with discovered services.
        Read-only; does not start discovery. Requires authenticated administrator access.
      operationId: getCloudNamespacesV2
      deprecated: true
      x-deprecation-reason: Prefer GET /v2/namespaces/{name}/workspaces/{workspaceId}/services on the Agent API.
      tags:
        - Cloud Services
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: Overall status of the discovery process
                    type: string
                    enum:
                      - none
                      - running
                      - complete
                      - error
                  progress:
                    description: Total number of namespaces / Number of discovered namespaces
                    type: number
                  elapsedSec:
                    description: Time spent (in sec)
                    type: number
                  totalNamespaces:
                    description: Total number of discovered cloud namespaces
                    type: number
                  totalServices:
                    description: Total number of discovered cloud services
                    type: number
                  totalServicesWithBaselines:
                    description: Total number of discovered cloud services with baseline
                    type: number
                  totalDocuments:
                    description: Total number of documents
                    type: number
                  namespaceData:
                    type: object
                    properties:
                      namespace:
                        $ref: "#/components/schemas/namespaceData"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples: {}
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"

components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      description: >-
        APIHUB workspace identifier (opaque string, case-sensitive).
        Defines the scope for package lookup by service name.
        Typically a short alphanumeric code (for example NC or QS); must not contain / or URL-unsafe characters.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9._-]+$"
      example: NC
  schemas:
    SpecificationType:
      title: type
      description: Type of the specification notation.
      type: string
      enum:
        - openapi-3-1
        - openapi-3-0
        - openapi-2-0
        - asyncapi-3-0
        - json-schema
        - markdown
        - graphql-schema
        - graphapi
        - introspection
        - unknown
      example: openapi-3-0
    DocumentFormat:
      title: format
      description: Format of the document.
      type: string
      enum:
        - json
        - yaml
        - md
        - graphql
        - gql
        - proto
        - unknown
      example: json
    ServiceV1:
      description: Discovered service
      type: object
      required:
        - id
        - name
        - specs
      properties:
        id:
          description: Cloud deployment service identifier
          type: string
          example: "apihub-be"
        name:
          description: Original service name
          type: string
          example: apihub-be
        url:
          type: string
          description: URL to view this service in the APIHUB Portal.
        serviceLabels:
          description: Service labels as key-value pairs (string keys with string values; keys are unique per service).
          type: object
          additionalProperties:
            type: string
          example:
            part-of: CloudBSS-CPQBE
            app_name: cpq
        availablePromoteStatuses:
          description: >-
            Package version statuses the authenticated user may assign when promoting this service's baseline package.
            Resolved by APIHUB from the caller's roles and package permissions
            (APIHUB GET /api/v2/users/{userId}/availablePackagePromoteStatuses); the agent does not compute this list locally.
          type: array
          items:
            type: string
            enum:
              - draft
              - release
              - release candidate
              - deprecated
              - archived
        baseline:
          description: Baseline package whose serviceName equals the service id.
          type: object
          required:
            - packageId
            - name
            - url
            - versions
          properties:
            packageId:
              description: Package id
              type: string
            name:
              description: Package Name
              type: string
            url:
              type: string
              description: The URL to view this baseline package in APIHUB Portal
            versions:
              description: Package release versions
              type: array
              items:
                type: string
        specs:
          description: List of API specification documents discovered on the target service during the last discovery run.
          type: array
          items:
            description: Service API documents
            type: object
            required:
              - fileId
              - name
              - originalPath
              - format
              - type
            properties:
              fileId:
                type: string
                description: Document file id
              name:
                type: string
                description: Document display name
                example: "Apihub public API"
              originalPath:
                type: string
                description: Document path on the target service
                example: "/v3/api-docs"
              format:
                type: string
                description: Document file format
                enum:
                  - json
                  - yaml
                  - graphql
                  - md
                  - unknown
                example: json
              type:
                type: string
                description: Document type
                example: "openapi-3-0"
                enum:
                  - openapi-2-0
                  - openapi-3-0
                  - openapi-3-1
                  - asyncapi-3-0
                  - markdown
                  - graphql
                  - json-schema
                  - unknown
              xApiKind:
                type: string
                description: API kind classification from the discovered document configuration (`x-api-kind` in apihub-swagger-config or per-document URL config). Example BWC.
                example: "BWC"
        proxyServerUrl:
          type: string
          description: Relative proxy URL used by the APIHUB Portal "Try It" feature to forward requests to the target service through the agent (same authentication as other agent APIs).
          example: '/agents/k8s-apps3_api-hub-dev/namespaces/api-hub-dev/services/apihub-agent-test-service/proxy/'
        error:
          type: string
          description: Discovery error(s)
    Service:
      description: Discovered service
      type: object
      required:
        - id
        - name
        - specs
      properties:
        id:
          description: Cloud deployment service identifier
          type: string
          example: "apihub-be"
        name:
          description: Original service name
          type: string
          example: apihub-be
        url:
          type: string
          description: URL to view this service in the APIHUB Portal.
        serviceLabels:
          description: Service labels as key-value pairs (string keys with string values; keys are unique per service).
          type: object
          additionalProperties:
            type: string
          example:
            part-of: CloudBSS-CPQBE
            app_name: cpq
        availablePromoteStatuses:
          description: >-
            Package version statuses the authenticated user may assign when promoting this service's baseline package.
            Resolved by APIHUB from the caller's roles and package permissions
            (APIHUB GET /api/v2/users/{userId}/availablePackagePromoteStatuses); the agent does not compute this list locally.
          type: array
          items:
            type: string
            enum:
              - draft
              - release
              - release candidate
              - deprecated
              - archived
        baseline:
          description: Baseline package whose serviceName equals the service id.
          type: object
          required:
            - packageId
            - name
            - url
            - versions
          properties:
            packageId:
              description: Package id
              type: string
            name:
              description: Package Name
              type: string
            url:
              type: string
              description: The URL to view this baseline package in APIHUB Portal
            versions:
              description: Package release versions
              type: array
              items:
                type: string
        specs:
          description: List of API specification documents discovered on the target service during the last discovery run.
          type: array
          items:
            description: Service API documents
            type: object
            required:
              - fileId
              - name
              - originalPath
              - format
              - type
            properties:
              fileId:
                type: string
                description: Document file id
              name:
                type: string
                description: Document display name
                example: "Apihub public API"
              originalPath:
                type: string
                description: Document path on the target service
                example: "/v3/api-docs"
              format:
                $ref: "#/components/schemas/DocumentFormat"
              type:
                $ref: "#/components/schemas/SpecificationType"
              xApiKind:
                type: string
                description: API kind classification from the discovered document configuration (`x-api-kind` in apihub-swagger-config or per-document URL config). Example BWC.
                example: "BWC"
        proxyServerUrl:
          type: string
          description: Relative proxy URL used by the APIHUB Portal "Try It" feature to forward requests to the target service through the agent (same authentication as other agent APIs).
          example: '/agents/k8s-apps3_api-hub-dev/namespaces/api-hub-dev/services/apihub-agent-test-service/proxy/'
        error:
          type: string
          description: Discovery error(s)
    namespaceData:
      description: Discovered namespaces
      type: object
      properties:
        services:
          description: The list of found services
          type: array
          items:
            $ref: "#/components/schemas/Service"
    ErrorResponse:
      description: Standard error response envelope returned for failed requests. Always includes HTTP status, internal error code, and human-readable message; params and debug are optional.
      type: object
      properties:
        status:
          description: HTTP Status Code
          type: number
        code:
          description: Internal string error code. Mandatory in response.
          type: string
        message:
          description: Human-readable error message describing the failure; intended for diagnostics and safe display to end users (typically English).
          type: string
        params:
          description: Optional key/value parameters used to format or contextualize the error message (for example, resource identifiers or field names). Keys are not standardized; values are strings. Clients may use params for localization or UI rendering but should not depend on specific keys being present.
          type: object
          example:
            "id": "12345"
            "type": "string"
        debug:
          description: Optional debug details (for example, stack traces). Returned only in non-production environments or when debug logging is enabled; do not rely on this field in production.
          type: string
      required:
        - status
        - code
        - message
  responses:
    internalServerError500:
      description: An unexpected server error prevented the request from completing. The response body follows the `ErrorResponse` schema. The optional `debug` field may include stack traces or other diagnostic details only in non-production environments.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    serviceUnavailable503:
      description: Service unavailable — the agent cannot handle the request (for example, overload, maintenance, or a dependency outage). The response body follows the `ErrorResponse` schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT bearer token issued by the APIHUB auth service.
        Send as Authorization: Bearer <token>.
        Token lifetime and claims follow APIHUB identity configuration; no additional agent-specific scopes are required beyond a valid authenticated session.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: api-key
      description: >-
        APIHUB API key authentication. Send an opaque API key in the api-key request header.
        Keys are issued and rotated in APIHUB; expiration and revocation follow APIHUB key management policies.
    CookieAuth:
      type: apiKey
      in: cookie
      name: apihub-access-token
      description: Session cookie authentication. Clients send the apihub-access-token cookie set by the APIHUB Portal UI after login.
