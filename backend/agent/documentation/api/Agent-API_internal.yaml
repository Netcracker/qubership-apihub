openapi: 3.0.3
info:
  title: APIHUB Agent Internal API
  version: 1.0.0
  description: |
    **Purpose:** Internal-only API contract for the APIHUB Agent.

    **Intended consumers:** APIHUB Portal and agents backend within the deployment network. Not exposed to external API consumers.

    **Major capabilities:**
    - Namespace inventory and route/ingress lookup
    - Asynchronous service discovery and specification retrieval
    - Service proxy for forwarding requests to discovered services

    **Authentication:**
    - Most operations: Bearer token, API key (`api-key` header), or session cookie (`apihub-access-token`)
    - Service proxy only (`GET /v1/agents/{agentId}/namespaces/{name}/services/{serviceId}/proxy/{path}`): `ProxyJWTAuth` or `ProxyApiKeyAuth` (see `components.securitySchemes`)
  contact:
    name: Netcracker Opensource Group
    email: opensourcegroup@netcracker.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-api-kind: no-BWC
servers:
  - url: "https://{agentUrl}/api"
    description: Base URL of the Agent backend API (replace {agentUrl} with the agent host, for example agent.local or localhost:8080).
    variables:
      agentUrl:
        default: localhost
        description: Hostname or host:port of the agent backend (for example localhost or agent.my-cluster.svc).
security:
  - BearerAuth: []
  - ApiKeyAuth: []
  - CookieAuth: []
tags:
  - name: Cloud Services
    description: Namespace management, service discovery, specification retrieval, route lookup, and service proxy endpoints.
paths:
  /v1/namespaces:
    get:
      summary: Get Namespace list
      description: Return the list of namespaces available in the current cloud.
      operationId: getNamespaces
      tags:
        - Cloud Services
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespaces:
                    description: List of cloud Namespaces
                    type: array
                    items:
                      type: string
                      description: Namespace name
                    maxItems: 100
                  cloudName:
                    type: string
                    description: Cloud name
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"
  /v1/namespaces/{name}/services:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      summary: Get list of services with data
      description: |
        Returns discovered services and the overall discovery status for the namespace.
        See the `status` field in the response (`none`, `running`, `complete`, `error`).
        Deprecated: use `GET /v2/namespaces/{name}/workspaces/{workspaceId}/services`.
      operationId: getNamespaceServices
      deprecated: true
      x-deprecation-reason: New version of API is created - GET /v2/namespaces/{name}/workspaces/{workspaceId}/services
      tags:
        - Cloud Services
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - services
                  - status
                properties:
                  services:
                    description: The list of the services found
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceV1"
                  status:
                    description: Overall status of the discovery process
                    type: string
                    enum:
                      - none
                      - running
                      - complete
                      - error
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"
  /v2/namespaces/{name}/workspaces/{workspaceId}/services:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Get list of services with data
      description: |
        Returns discovered services and the overall discovery status.
        See the `status` field in the response (`none`, `running`, `complete`, `error`).
        Start discovery via `POST /v2/namespaces/{name}/workspaces/{workspaceId}/discover`.
        Deprecated: migrate to `GET /v3/namespaces/{name}/workspaces/{workspaceId}/services` for per-service discovery diagnostics.
      operationId: getNamespaceServicesV2
      deprecated: true
      x-deprecation-reason: New version of API is created - GET /v3/namespaces/{name}/workspaces/{workspaceId}/services
      tags:
        - Cloud Services
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - services
                  - status
                properties:
                  services:
                    description: The list of the services found
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
                  status:
                    description: Overall status of the discovery process
                    type: string
                    enum:
                      - none
                      - running
                      - complete
                      - error
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"
  /v3/namespaces/{name}/workspaces/{workspaceId}/services:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      summary: Get list of services with data and diagnostic information
      description: |
        Returns discovered services and the overall discovery status with per-service diagnostics.
        See the `status` field in the response (`none`, `running`, `complete`, `error`).
        Start discovery via `POST /v2/namespaces/{name}/workspaces/{workspaceId}/discover`.
        Each distinct services list passed to the discovery request has its own stored result;
        use the `services` query parameter to address the result of a scoped discovery.
      operationId: getNamespaceServicesV3
      parameters:
        - $ref: "#/components/parameters/RequestedServices"
      tags:
        - Cloud Services
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - services
                  - status
                properties:
                  services:
                    description: The list of the services found
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceV3"
                  status:
                    description: Overall status of the discovery process
                    type: string
                    enum:
                      - none
                      - running
                      - complete
                      - error
                  debug:
                    description: Diagnostic details for a failed discovery process. Empty when the process succeeded.
                    type: string
                  requestedServices:
                    description: |
                      The services list the addressed discovery result was started with.
                      Absent on the default (unscoped) result, where the whole namespace was discovered.
                      Compare it against `services[].serviceName` to find requested services that were not found in the namespace.
                    type: array
                    items:
                      type: string
                    example: ["apihub-be", "apihub-fe"]
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"
  /v1/namespaces/{name}/discover:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    post:
      tags:
        - Cloud Services
      operationId: postNamespaceDiscover
      deprecated: true
      x-deprecation-reason: New version of API is created - POST /v2/namespaces/{name}/workspaces/{workspaceId}/discover
      summary: Start discovery process
      description: |
        Starts an asynchronous service discovery process.
        No process ID is returned. Retrieve the result via getServices; a result limited to a services list is
        readable only through getNamespaceServicesV3, passing the same list in its `services` parameter.
        Accepts the same optional request body as postNamespaceDiscoverV2.
        Each distinct services list has its own stored result: discoveries with different lists run and are stored
        independently, and starting a discovery again with the same list resets and rebuilds that list's result.
        An absent body, or an absent or empty services list, discovers the whole namespace and stores the result
        as the default (unscoped) one.
      requestBody:
        required: false
        description: Optional discovery scope. Omit the body entirely to discover the whole namespace.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryRequest"
      responses:
        "202":
          description: Success
          content: {}
        "400":
          $ref: "#/components/responses/badRequest400"
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"
  /v2/namespaces/{name}/workspaces/{workspaceId}/discover:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags:
        - Cloud Services
      operationId: postNamespaceDiscoverV2
      summary: Start discovery process
      description: |
        Starts an asynchronous service discovery process.
        No process ID is returned. Retrieve the result via getServices; a result limited to a services list is
        readable only through getNamespaceServicesV3, passing the same list in its `services` parameter.
        Pass a request body to limit the discovery scope to a well-known list of services.
        Each distinct services list has its own stored result: discoveries with different lists run and are stored
        independently, and starting a discovery again with the same list resets and rebuilds that list's result.
        An absent body, or an absent or empty services list, discovers the whole namespace and stores the result
        as the default (unscoped) one.
      requestBody:
        required: false
        description: Optional discovery scope. Omit the body entirely to discover the whole namespace.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryRequest"
      responses:
        "202":
          description: Success
          content: {}
        "400":
          $ref: "#/components/responses/badRequest400"
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"
  /v1/namespaces/{name}/services/{serviceId}/specs/{specId}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/ServiceId"
      - $ref: "#/components/parameters/SpecificationId"
    get:
      summary: Get service specification
      description: |
        Retrieve a service API specification by specification ID for the given namespace and service.
        Returns the document body in JSON, YAML, or plain text depending on the stored format and Accept header.
        To download a document found by a discovery limited to a services list, use
        getNamespaceServicesIdSpecsIdV2 and pass the same list.
      operationId: getNamespaceServicesIdSpecsId
      deprecated: true
      x-deprecation-reason: New version of API is created - GET /v2/namespaces/{name}/workspaces/{workspaceId}/services/{serviceId}/specs/{specId}
      tags:
        - Cloud Services
      responses:
        "200":
          description: Successful operation
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
            application/json:
              schema:
                type: object
            application/x-yaml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/notFound404"
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"
  /v2/namespaces/{name}/workspaces/{workspaceId}/services/{serviceId}/specs/{specId}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ServiceId"
      - $ref: "#/components/parameters/SpecificationId"
    get:
      summary: Get service specification
      description: |
        Retrieve a service API specification by specification ID for the given namespace, workspace, and service.
        Returns the document body in JSON, YAML, or plain text depending on the stored format and Accept header.
      operationId: getNamespaceServicesIdSpecsIdV2
      tags:
        - Cloud Services
      parameters:
        - $ref: "#/components/parameters/RequestedServices"
      responses:
        "200":
          description: Successful operation
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
            application/json:
              schema:
                type: object
            application/x-yaml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/notFound404"
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"
  /v1/agents/{agentId}/namespaces/{name}/services/{serviceId}/proxy/{path}:
    get:
      summary: Proxy endpoint to service
      description: |
        Forwards the HTTP GET request to the target cloud service through the agent proxy.
        Request headers and query parameters are passed through; response status codes and bodies are returned unchanged from the proxied service.
        Requires ProxyJWTAuth or ProxyApiKeyAuth (or CookieAuth). When the agent `INSECURE_PROXY` environment variable is not enabled, the X-Apihub-Authorization header must contain valid nc-service authorization.
      operationId: getAgentsIdNamespacesIdServicesProxy
      security:
        - ProxyJWTAuth: []
        - ProxyApiKeyAuth: []
        - CookieAuth: []
      tags:
        - Cloud Services
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ServiceId"
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: |
            Downstream resource path relative to the proxied service base URL.
            Prefer sending query parameters as normal HTTP query parameters on the request URL rather than embedding them in this path segment.
            Path segments must be URL-encoded when they contain special characters (see example).
          example: api/v2/escaped/te%20xt/text/text123?escaped=te%20xt
        - name: X-Apihub-Authorization
          in: header
          schema:
            type: string
          description: |
            nc-service authorization token forwarded to the target service.
            Required when the agent `INSECURE_PROXY` environment variable is empty or `false`; optional when `INSECURE_PROXY=true`.
            Configure `INSECURE_PROXY` in the agent deployment (Helm values or container environment).
      responses:
        1XX:
          description: Informational response from the proxied service (rare; passed through unchanged).
          content:
            "*/*":
              schema:
                description: Response body from the proxied service; format varies by backend.
        2XX:
          description: Successful response from the proxied service (for example 200 OK); passed through unchanged.
          content:
            "*/*":
              schema:
                description: Response body from the proxied service; format varies by backend.
        3XX:
          description: Redirection response from the proxied service; location headers and bodies are passed through.
          content:
            "*/*":
              schema:
                description: Optional redirect response body from the proxied service.
        4XX:
          description: Client error from the agent or proxied service (for example 400 invalid path, 401 unauthorized, 404 service not found).
          content:
            "*/*":
              schema:
                description: Error payload from the agent or proxied service; may follow ErrorResponse or backend-specific format.
        5XX:
          description: Server error from the agent or proxied service; proxied backend errors are returned verbatim when possible.
          content:
            "*/*":
              schema:
                description: Error payload from the agent or proxied service; may follow ErrorResponse or backend-specific format.
  /v1/namespaces/{name}/serviceNames:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      summary: Get list of service names
      description: |
        Synchronously retrieve the list of service names in the specified namespace without running discovery.
      operationId: getNamespaceServicesNames
      tags:
        - Cloud Services
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - serviceNames
                properties:
                  serviceNames:
                    description: List of the service names in namespace
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: service id
                        name:
                          type: string
                          description: service name
        "401":
          $ref: "#/components/responses/unauthorized401"
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"
  /api/v1/namespaces/{name}/routes/{routeName}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - name: routeName
        in: path
        description: |
          Route or Ingress resource name unique within the namespace (for example public-gateway).
        required: true
        schema:
          type: string
        example: public-gateway
    get:
      summary: Get route/ingress description
      description: |
        Return host and metadata for the specified Route or Ingress in the namespace.
        Use this to resolve the public hostname exposed by a gateway or ingress controller.
      operationId: getRouteByName
      tags:
        - Cloud Services
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    description: Route/Ingress unique identifier
                    type: string
                  namespace:
                    description: Route/Ingress namespace
                    type: string
                  host:
                    description: Route/Ingress host without protocol, port and path - only domain
                    type: string
        "401":
          $ref: "#/components/responses/unauthorized401"
        "404":
          $ref: "#/components/responses/notFound404"
        "500":
          $ref: "#/components/responses/internalServerError500"
        "503":
          $ref: "#/components/responses/serviceUnavailable503"
  /v1/namespaces/{name}/serviceItems:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      summary: Get list of service items
      description: |
        Synchronously retrieve the list of service items in the specified namespace without running discovery.
      operationId: getNamespaceServicesItems
      tags:
        - Cloud Services
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - serviceItems
                properties:
                  serviceItems:
                    description: List of the service items in namespace
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: service id
                        namespace:
                          type: string
                          description: service namespace
                        serviceName:
                          type: string
                          description: service name
                        url:
                          type: string
                          description: service base url
                        serviceLabels:
                          description: Service labels as key-value pairs.
                          type: object
                          additionalProperties:
                            type: string
                        serviceAnnotations:
                          description: Service annotations as key-value pairs.
                          type: object
                          additionalProperties:
                            type: string
                        servicePods:
                          type: array
                          description: list of service pod ids
                          items:
                            type: string
                        proxyServerUrl:
                          type: string
                          description: Agent proxy base URL used to forward HTTP requests to the target service. May be used by interactive API clients.
        "401":
          $ref: "#/components/responses/unauthorized401"
        "500":
          $ref: "#/components/responses/internalServerError500"

components:
  parameters:
    AgentId:
      name: agentId
      in: path
      description: Agent instance ID (for example k8s-apps3_api-hub-dev).
      required: true
      schema:
        type: string
      example: k8s-apps3_api-hub-dev
    Namespace:
      name: name
      description: |
        Kubernetes namespace name (DNS label format: lowercase alphanumeric characters and hyphens).
        Must match an existing namespace in the connected cloud cluster.
      in: path
      required: true
      schema:
        type: string
      example: api-hub-dev
    WorkspaceId:
      name: workspaceId
      in: path
      description: Unique identifier of the workspace. The workspace defines the scope for package searches by service name.
      required: true
      schema:
        type: string
      example: NC
    ServiceId:
      name: serviceId
      in: path
      description: Cloud service identifier (deployment service name, unique within the namespace).
      required: true
      schema:
        type: string
      example: apihub-be
    SpecificationId:
      name: specId
      in: path
      description: Specification identifier (document file ID assigned during discovery).
      required: true
      schema:
        type: string
    RequestedServices:
      name: services
      in: query
      required: false
      description: |
        Comma-separated list of service names identifying which discovery result to address.
        Pass the same list that was sent in the discovery request body to read that discovery's result;
        documents discovered by a scoped discovery must also be downloaded with the same list.
        The list is treated as a set: order and duplicates do not affect which result is addressed.
        When absent or empty, the default (unscoped) discovery result is addressed.
        A result that was never produced for the given list has status `none`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      example: ["apihub-be", "apihub-fe"]
  schemas:
    SpecificationType:
      title: type
      description: Type or format of the API document specification (for example openapi-3-0, asyncapi-3-0, json-schema).
      type: string
      enum:
        - openapi-3-1
        - openapi-3-0
        - openapi-2-0
        - asyncapi-3-0
        - json-schema
        - markdown
        - graphql-schema
        - graphapi
        - introspection
        - unknown
      example: openapi-3-0
    DocumentFormat:
      title: format
      description: Format of the document.
      type: string
      enum:
        - json
        - yaml
        - md
        - graphql
        - gql
        - proto
        - unknown
      example: json
    ServiceV1:
      description: Discovered cloud service with linked APIHUB baseline package and API documents found during discovery.
      type: object
      required:
        - id
        - name
        - specs
      properties:
        id:
          description: Cloud deployment service identifier
          type: string
          example: "apihub-be"
        name:
          description: Original service name
          type: string
          example: apihub-be
        url:
          type: string
          description: URL to view this service in the APIHUB Portal.
        serviceLabels:
          description: Service labels as key-value pairs.
          type: object
          additionalProperties:
            type: string
          example:
            part-of: CloudBSS-CPQBE
            app_name: cpq
        availablePromoteStatuses:
          description: |
            List of statuses available to the user to promote the service.
            The list of statuses is calculated based on the user's permissions.
          type: array
          items:
            type: string
            enum:
              - draft
              - release
              - release candidate
              - deprecated
        baseline:
          description: |
            Linked APIHUB baseline package for this service, resolved in the workspace by matching the package serviceName metadata to the service `name` field (exact, case-sensitive match).
          type: object
          required:
            - packageId
            - name
            - url
            - versions
          properties:
            packageId:
              description: Package id
              type: string
            name:
              description: Package Name
              type: string
            url:
              type: string
              description: URL to view this baseline package in the APIHUB Portal.
            versions:
              description: Package release versions
              type: array
              items:
                type: string
        specs:
          description: List of the service's API documents found in the target environment.
          type: array
          items:
            description: Service API documents
            type: object
            required:
              - fileId
              - name
              - originalPath
              - format
              - type
            properties:
              fileId:
                type: string
                description: Document file ID
              name:
                type: string
                description: Document display name
                example: "Apihub public API"
              originalPath:
                type: string
                description: Document path on the target service
                example: "/v3/api-docs"
              format:
                type: string
                description: Document file format
                enum:
                  - json
                  - yaml
                  - graphql
                  - md
                  - unknown
                example: json
              type:
                type: string
                description: Document type
                example: "openapi-3-0"
                enum:
                  - openapi-2-0
                  - openapi-3-0
                  - openapi-3-1
                  - asyncapi-3-0
                  - markdown
                  - graphql
                  - json-schema
                  - unknown
              xApiKind:
                type: string
                description: API kind value from the Swagger/APIHUB configuration (for example BWC).
                example: "BWC"
        proxyServerUrl:
          type: string
          description: Agent proxy base URL used to forward HTTP requests to the target service. May be used by interactive API clients.
          example: '/agents/k8s-apps3_api-hub-dev/namespaces/api-hub-dev/services/apihub-agent-test-service/proxy/'
        error:
          type: string
          description: Human-readable discovery error message(s), present when discovery failed for the service.
    Service:
      description: |
        Discovered cloud service with linked APIHUB baseline package and API documents found during discovery.
        Deprecated: use the `ServiceV3` schema returned by `GET /v3/namespaces/{name}/workspaces/{workspaceId}/services`.
      type: object
      deprecated: true
      required:
        - id
        - name
        - specs
      properties:
        id:
          description: Cloud deployment service identifier
          type: string
          example: "apihub-be"
        name:
          description: Original service name
          type: string
          example: apihub-be
        url:
          type: string
          description: URL to view this service in the APIHUB Portal.
        serviceLabels:
          description: Service labels as key-value pairs.
          type: object
          additionalProperties:
            type: string
          example:
            part-of: CloudBSS-CPQBE
            app_name: cpq
        availablePromoteStatuses:
          description: |
            List of statuses available to the user to promote the service.
            The list of statuses is calculated based on the user's permissions.
          type: array
          items:
            type: string
            enum:
              - draft
              - release
              - release candidate
              - deprecated
        baseline:
          description: |
            Linked APIHUB baseline package for this service, resolved in the workspace by matching the package serviceName metadata to the service `name` field (exact, case-sensitive match).
          type: object
          required:
            - packageId
            - name
            - url
            - versions
          properties:
            packageId:
              description: Package id
              type: string
            name:
              description: Package Name
              type: string
            url:
              type: string
              description: URL to view this baseline package in the APIHUB Portal.
            versions:
              description: Package release versions
              type: array
              items:
                type: string
        specs:
          description: List of the service's API documents found in the target environment.
          type: array
          items:
            description: Service API documents
            type: object
            required:
              - fileId
              - name
              - originalPath
              - format
              - type
            properties:
              fileId:
                type: string
                description: Document file ID
              name:
                type: string
                description: Document display name
                example: "Apihub public API"
              originalPath:
                type: string
                description: Document path on the target service
                example: "/v3/api-docs"
              format:
                $ref: "#/components/schemas/DocumentFormat"
              type:
                $ref: "#/components/schemas/SpecificationType"
              xApiKind:
                type: string
                description: API kind value from the Swagger/APIHUB configuration (for example BWC).
                example: "BWC"
        proxyServerUrl:
          type: string
          description: Agent proxy base URL used to forward HTTP requests to the target service. May be used by interactive API clients.
          example: '/agents/k8s-apps3_api-hub-dev/namespaces/api-hub-dev/services/apihub-agent-test-service/proxy/'
        error:
          type: string
          description: Human-readable discovery error message(s), present when discovery failed for the service.
    ServiceV3:
      description: Discovered service with diagnostic information
      type: object
      required:
        - id
        - name
        - docs
      properties:
        id:
          description: Cloud deployment service identifier
          type: string
          example: "apihub-be"
        name:
          description: Original service name
          type: string
          example: apihub-be
        url:
          type: string
          description: URL to view this service in the APIHUB Portal.
        serviceLabels:
          description: Service labels as key-value pairs.
          type: object
          additionalProperties:
            type: string
          example:
            part-of: CloudBSS-CPQBE
            app_name: cpq
        availablePromoteStatuses:
          description: |
            List of statuses available to the user to promote the service.
            The list of statuses is calculated based on the user's permissions.
          type: array
          items:
            type: string
            enum:
              - draft
              - release
              - release candidate
              - deprecated
        baseline:
          description: |
            Linked APIHUB baseline package for this service, resolved in the workspace by matching the package serviceName metadata to the service `name` field (exact, case-sensitive match).
          type: object
          required:
            - packageId
            - name
            - url
            - versions
          properties:
            packageId:
              description: Package id
              type: string
            name:
              description: Package Name
              type: string
            url:
              type: string
              description: URL to view this baseline package in the APIHUB Portal.
            versions:
              description: Package release versions
              type: array
              items:
                type: string
        documents:
          description: List of the service's API documents found in the target environment.
          type: array
          items:
            $ref: "#/components/schemas/DocumentV3"
        proxyServerUrl:
          type: string
          description: Agent proxy base URL used to forward HTTP requests to the target service. May be used by interactive API clients.
          example: '/agents/k8s-apps3_api-hub-dev/namespaces/api-hub-dev/services/apihub-agent-test-service/proxy/'
        error:
          type: string
          description: Human-readable discovery error message(s), present when discovery failed for the service.
        diagnosticInfo:
          $ref: "#/components/schemas/ServiceDiagnostic"
    DocumentV3:
      description: Service API document
      type: object
      required:
        - fileId
        - name
        - docPath
        - format
        - type
      properties:
        fileId:
          type: string
          description: Document file ID
        name:
          type: string
          description: Document display name
          example: "Apihub public API"
        docPath:
          type: string
          description: Relative path to the API document on the target service (for example /v3/api-docs).
          example: "/v3/api-docs"
        configPath:
          type: string
          description: Path to the config that referenced this document
          example: "/v3/api-docs/swagger-config"
        format:
          $ref: "#/components/schemas/DocumentFormat"
        type:
          $ref: "#/components/schemas/SpecificationType"
        xApiKind:
          type: string
          description: API kind value from the Swagger/APIHUB configuration (for example BWC).
          example: "BWC"
    ServiceDiagnostic:
      description: Diagnostic information about service discovery
      type: object
      properties:
        endpointCalls:
          description: List of endpoint calls made during discovery
          type: array
          items:
            $ref: "#/components/schemas/EndpointCallInfo"
    EndpointCallInfo:
      description: Information about a document/config endpoint call attempt during discovery
      type: object
      properties:
        path:
          type: string
          description: Relative path that was called
          example: "/v3/api-docs"
        statusCode:
          type: integer
          description: HTTP status code returned
          example: 404
        errorSummary:
          type: string
          description: Brief description of the error
          example: "Not Found"
    DiscoveryRequest:
      description: |
        Optional body of a discovery request, used to limit the discovery scope to a well-known list of services.
        An absent body, or an absent or empty services list, discovers every service in the namespace and stores
        the result as the default (unscoped) one.
        Each distinct services list has its own stored result; the list is treated as a set, so order and duplicates
        do not affect which result the discovery writes to.
      type: object
      properties:
        services:
          description: |
            Service names to discover. Each entry is matched, exactly and case-sensitively, against the service name
            reported as `serviceName` in the getServices response - that is, the Kubernetes service name with any
            trailing blue-green `-v<N>` suffix removed. It is the same name used to resolve the APIHUB baseline package.
            One entry therefore selects every blue-green variant of that service: `apihub-be` matches both
            `apihub-be-v1` and `apihub-be-v2`. A raw Kubernetes service name such as `apihub-be-v1` matches nothing,
            so do not pass the `id` field of a previous response here. An entry that is empty or carries leading or
            trailing whitespace can match no service and is rejected with 400. A requested name that is absent from the
            namespace, or that names a service the agent excludes from discovery by label, is ignored: discovery is
            asynchronous, so compare `requestedServices` against `services[].serviceName` in the getServices response
            to find them.
          type: array
          items:
            type: string
            minLength: 1
          example: ["apihub-be", "apihub-fe"]
    ErrorResponse:
      description: Standard error response envelope returned for failed requests. Includes HTTP status, internal error code, and human-readable message; params and debug are optional.
      type: object
      properties:
        status:
          description: HTTP status code (integer) returned by the response, for example 400 or 500.
          type: integer
        code:
          description: Internal string error code identifying the failure type (for example VALIDATION_ERROR).
          type: string
        message:
          description: Human-readable error message.
          type: string
        params:
          description: Optional structured parameters providing additional context for the error (key-value pairs).
          type: object
          example:
            "id": "12345"
            "type": "string"
        debug:
          description: |
            Debug details (for example stack trace). Returned only in non-production environments when detailed logging is enabled.
          type: string
      required:
        - status
        - code
        - message
  responses:
    unauthorized401:
      description: |
        Authentication failed or credentials were not provided.
        Typical causes include a missing, expired, or invalid Bearer token, API key, or session cookie.
        Re-authenticate via APIHUB (obtain a new Bearer token, API key, or session cookie) and retry the request.
        The response body follows the ErrorResponse schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    badRequest400:
      description: |
        The request could not be processed. Typical causes are a malformed JSON body, a body larger than 1 MiB, or a
        requested service name that is empty or carries leading or trailing whitespace.
        The response body follows the ErrorResponse schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    notFound404:
      description: The requested resource was not found (namespace, route, service, or specification ID is invalid or missing).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    internalServerError500:
      description: |
        Internal server error — unexpected failure on the server side. Retry may succeed; contact support if the problem persists.
        The response body follows the ErrorResponse schema; the optional debug field may include diagnostic details only in non-production environments.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    serviceUnavailable503:
      description: Service unavailable — temporary overload or maintenance.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT bearer token issued by the APIHUB auth service. Include in the Authorization header as: Authorization: Bearer <token>.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: api-key
      description: APIHUB API key authentication. Send the key in the api-key request header.
    CookieAuth:
      type: apiKey
      in: cookie
      name: apihub-access-token
      description: Session cookie authentication. Clients send the apihub-access-token cookie set by the APIHUB Portal UI after login.
    ProxyJWTAuth:
      type: apiKey
      in: header
      name: X-Apihub-Authorization
      description: Custom JWT authentication for the proxy endpoint. Send a signed JWT in the X-Apihub-Authorization header.
    ProxyApiKeyAuth:
      type: apiKey
      in: header
      name: X-Apihub-ApiKey
      description: Custom API key authentication for the proxy endpoint. Send the key in the X-Apihub-ApiKey header.
