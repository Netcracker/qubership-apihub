components:
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      description: |
        Unique agent identifier assigned at registration. Format is `{cloud}_{namespace}` (both
        parts lowercased). Obtain valid values from `GET /api/v2/agents`.
      schema:
        type: string
        example: production_team-a
    Namespace:
      name: namespace
      in: path
      required: true
      description: |
        Kubernetes namespace name on the agent deployment cloud. Case-sensitive string as reported
        by the agent.
      schema:
        type: string
        example: team-a
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: |
        APIHUB workspace identifier that scopes discovery and snapshot operations. Typically a
        UUID assigned when the workspace is created in APIHUB.
      schema:
        type: string
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    ServiceId:
      name: serviceId
      in: path
      required: true
      description: |
        Discovered service identifier. Must be URL-encoded when used as a path segment; encode
        reserved characters such as `/`, `?`, `#`, and `%`.
      schema:
        type: string
        example: my%2Fservice%3Fv1
    Page:
      name: page
      in: query
      required: false
      description: Page number for pagination
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        default: 100
    ProcessId:
      name: processId
      in: path
      required: true
      description: |
        UUID of an authentication security check process. Returned in the `202` response of
        `POST /api/v2/security/authCheck` and used to poll status or download the report.
      schema:
        type: string
        format: uuid
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    RequestedServices:
      name: services
      in: query
      required: false
      description: |
        Comma-separated list of service names identifying which discovery result to address. Pass
        the same list that was sent in the discovery request body to read that discovery's result;
        documents discovered by a scoped discovery must also be downloaded with the same list.

        The list is treated as a set: order and duplicates do not affect which result is addressed.
        When absent or empty, the default (unscoped) discovery result is addressed. A result that
        was never produced for the given list has status `none`.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
      example:
        - apihub-be
        - apihub-fe
  schemas:
    AgentInstance:
      type: object
      properties:
        agentId:
          type: string
          description: Unique agent identifier (`{cloud}_{namespace}`, lowercased)
        agentDeploymentCloud:
          type: string
          description: Cloud where agent is deployed
        agentDeploymentNamespace:
          type: string
          description: Namespace where agent is deployed
        agentUrl:
          type: string
          format: uri
          description: |
            HTTPS URL of the agent keepalive endpoint, reachable from the agents backend within
            the deployment network. Example: `https://agent.example.com/api/v1/signal`.
        lastActive:
          type: string
          format: date-time
          description: Last activity timestamp
        status:
          type: string
          enum:
            - active
            - inactive
          description: Current status of the agent
        backendVersion:
          type: string
          description: |
            Version of the APIHUB backend the agent is configured to communicate with (semver).
            Used with `compatibilityError` to detect unsupported agent deployments.
        name:
          type: string
          description: Agent name
        agentVersion:
          type: string
          description: |
            Version of the deployed agent software (semver). Differs from `backendVersion`, which
            refers to the APIHUB backend dependency rather than the agent binary.
        compatibilityError:
          $ref: '#/components/schemas/AgentCompatibilityError'
    AgentCompatibilityError:
      type: object
      properties:
        severity:
          type: string
          enum:
            - error
            - warning
          description: Severity level of compatibility error
        message:
          type: string
          description: Error message details
    CustomError:
      type: object
      description: |
        Standard error response returned on failed requests. Required fields are `status` and
        `message`; `code`, `debug`, and `params` are optional.
      required:
        - status
        - message
      properties:
        status:
          type: integer
          description: HTTP status code
        code:
          type: string
          description: |
            Stable internal error identifier for programmatic handling. Present for
            application-defined errors; may be omitted for unexpected internal failures.
        message:
          type: string
          description: |
            Human-readable error summary intended for API clients and operators. Messages are in
            English, not localized, and may include remediation hints or placeholder tokens
            (for example, `$param`) substituted using values from `params`. Safe to display in
            admin tooling; avoid exposing `debug` details to end users.
        debug:
          type: string
          description: |
            Optional operator-only diagnostics (stack traces, internal error details, correlation
            data). May contain sensitive information; do not expose to end users or log in
            untrusted contexts.
        params:
          type: object
          additionalProperties: true
          description: |
            Optional free-form map of contextual parameters for the error. Typical keys include
            `agentId`, `namespace`, `workspaceId`, `processId`, `param`, and `value` depending on
            the error code; values are strings or numbers.
    DiscoveryRequest:
      type: object
      description: |
        Optional body of a discovery request, used to limit the discovery scope to a well-known
        list of services. An empty body and an empty `services` list are also accepted and both mean
        whole-namespace discovery, stored as the default (unscoped) result.

        Each distinct services list has its own stored result; the list is treated as a set, so
        order and duplicates do not affect which result the discovery writes to. Read the result
        back by passing the same list in the `services` query parameter of the services listing.

        Agents that predate this capability ignore the body and discover the whole namespace.
        Check `requestedServices` in the services listing to confirm the scope was applied: an
        agent that honoured a narrowed request always echoes it back, so if the field is absent
        once `status` is no longer `running`, the scope was not applied.
      properties:
        services:
          type: array
          items:
            type: string
            minLength: 1
          description: |
            Service names to discover. Each entry is matched exactly and case-sensitively against
            the name reported as `serviceName` in the services listing - that is, the Kubernetes
            service name with any trailing blue-green `-v<N>` suffix removed.

            One entry therefore selects every blue-green variant of that service: `apihub-be`
            matches both `apihub-be-v1` and `apihub-be-v2`. A raw Kubernetes service name such as
            `apihub-be-v1` matches nothing, so do not pass the `id` field of a previous response
            here. An entry that is empty or carries leading or trailing whitespace can match no
            service and is rejected with 400.

            A name not present in the namespace, or one naming a service the agent excludes from
            discovery by label, is ignored; compare `requestedServices` against
            `services[].serviceName` in the services listing to find them.
          example:
            - apihub-be
            - apihub-fe
  responses:
    BadRequest:
      description: |
        Invalid request. Typical causes include malformed JSON, missing required fields, invalid
        query parameters, unrecognized enum values, a request body larger than 1 MiB, or a
        requested service name that is empty or carries leading or trailing whitespace. The
        response body uses the CustomError schema with remediation hints in the message and debug
        fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomError'
    Unauthorized:
      description: |
        Authentication required, or the provided token or credentials are invalid or expired.
        Re-authenticate or refresh the token before retrying the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomError'
    NotFound:
      description: |
        Requested resource was not found. Typical causes include an invalid agent, namespace,
        workspace, service, file, snapshot version, or security check process ID. The response
        body uses the CustomError schema; check `message` and `params` for the missing identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomError'
    FailedDependency:
      description: |
        An upstream dependency required to fulfill the request is unavailable. Typically returned
        when the agent cannot be reached or APIHUB backend communication fails (for example,
        listing namespaces). The CustomError body may include `agentId` or related identifiers in
        `params`. Clients should retry with exponential backoff once the dependency is restored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomError'
    InternalServerError:
      description: |
        Unexpected server error. Returns HTTP 500 with a CustomError body. Clients should retry
        later; contact support with any correlation or debug details from the response if the
        problem persists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomError'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token authentication. Send the token in the Authorization header as
        `Authorization: Bearer <token>`. Tokens are issued by the APIHUB authentication service;
        use a valid session or service account JWT with appropriate APIHUB permissions.
    CookieAuth:
      type: apiKey
      in: cookie
      name: apihub-access-token
      description: |
        Session authentication via the `apihub-access-token` cookie set after interactive login to
        APIHUB. The cookie is HttpOnly and Secure in production deployments. Prefer Bearer or
        Personal Access Token for programmatic integrations.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: api-key
      description: |
        API key authentication. Send the key in the `api-key` request header. Keys are issued
        through APIHUB administration; ensure the key belongs to a user with sufficient privileges
        for the requested operation. Rotate or revoke compromised keys in the APIHUB admin UI.
    PersonalAccessToken:
      type: apiKey
      in: header
      name: X-Personal-Access-Token
      description: |
        Personal Access Token authentication for user-level programmatic access. Send the token
        in the `X-Personal-Access-Token` header. Create and revoke tokens in APIHUB user settings;
        the token inherits the issuing user's permissions and remains valid until revoked or expired.
