name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Build Docker image
        run: |
          mvn -B -pl java-task-consumer -am package -DskipTests
          docker build -t ghcr.io/netcracker/qubership-apihub-java-task-consumer:ci .
