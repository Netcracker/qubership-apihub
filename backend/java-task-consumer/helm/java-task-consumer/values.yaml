replicaCount: 1

image:
  repository: ghcr.io/netcracker/qubership-apihub-java-task-consumer
  tag: dev
  pullPolicy: IfNotPresent

service:
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

env:
  logLevel: ""
  requestIntervalMs: "3000"
  statusIntervalMs: "5000"
  jdiffThreads: "4"

apihub:
  # Address of libraries-backend, the service that serves the Java build queue; http:// is assumed without a scheme.
  backendAddress: qubership-apihub-libraries-backend:8080
  accessToken: ""

# Writable directories of a container whose root filesystem is read-only. Each is an emptyDir volume, so its
# content does not survive a pod restart; the worker fetches the artifacts again.
storage:
  # Task work directory (WORK_DIR): task and result ZIP files and the extracted jars of the build in progress.
  workDir:
    path: /tmp/java-task-consumer
    # Optional; emptyDir size limit; an empty value leaves it unbounded. Example: 2Gi
    sizeLimit: ""
  # Maven local repository (~/.m2 of the image user, UID 10001), where resolved artifacts are cached between tasks.
  mavenRepository:
    path: /home/appuser/.m2
    # Optional; emptyDir size limit; an empty value leaves it unbounded. Example: 4Gi
    sizeLimit: ""

# OCI registry credentials for daemonless subject image pull (java-upgrade-impact, subject.type=docker).
# Mounts config.json and sets DOCKER_CONFIG=/etc/secrets/docker.
registryAuth:
  # Use an existing Secret that contains key config.json (recommended in production).
  existingSecret: ""
  # Or let the chart create a Secret from inline Docker config JSON (dev/CI only).
  configJson: ""

serviceAccount:
  create: true
