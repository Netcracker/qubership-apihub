services:
  qubership-apihub-java-task-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/netcracker/qubership-apihub-java-task-consumer:dev
    ports:
      - "3001:3000"
    env_file:
      - java-task-consumer.env
    volumes:
      - maven-repo:/tmp/.m2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

volumes:
  maven-repo:
