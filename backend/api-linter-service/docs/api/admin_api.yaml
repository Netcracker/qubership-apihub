openapi: 3.0.3
info:
  title: Linter Service Admin API
  version: "1.0"
  description: >
    Provides administrative operations for managing validation rulesets and performing Linter Service debugging
    (runtime log level inspection and adjustment). All operations require the system administrator role and
    appropriate authentication (Bearer token, API key, or Personal Access Token).
  contact:
    name: Netcracker Opensource Group
    email: opensourcegroup@netcracker.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
security:
  - BearerAuth: []
  - api-key: []
  - PersonalAccessToken: []
tags:
  - name: Ruleset Management
    description: APIs for managing validation rulesets.
  - name: Debug
    description: API for debugging and log management.
paths:
  /api/v1/rulesets:
    get:
      tags:
        - Ruleset Management
      summary: Get a list of rulesets
      description: >
        Returns a sorted list of rulesets.
          The sorting follows a strict order:
            1. The currently active ruleset (always appears first).
            2. Rulesets that have never been activated (in order of creation).
            3. All other rulesets, sorted by the latest activation date (most recent first).

        There is always one active ruleset in the system for each supported API type and linter.
        This operation is available only to users with the `system administrator` role.
      operationId: getRulesets
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
        - name: limit
          in: query
          description: Number of items per page (max 100).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/Ruleset"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Ruleset Management
      summary: Create a new ruleset
      description: >
        Allows an admin to create a new ruleset by uploading a ruleset file via multipart form data.
        The required file format depends on the selected linter (for example, Spectral YAML for spectral,
        or AI linter rules YAML for ai_linter). The new ruleset is stored with inactive status.

        Input validation at upload checks required fields, supported apiType and linter values, file
        readability, and rulesetName uniqueness within the selected apiType. Ruleset rule content is not
        linted at upload time.
      operationId: postRuleset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RulesetCreate"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruleset"
        "400":
          description: >
            Bad Request — missing required fields, invalid multipart body, or unreadable ruleset file.
            Returns ErrorResponse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingParams:
                  summary: Missing required field
                  value:
                    status: 400
                    code: "15"
                    message: "Required parameters are missing: $params"
                    params:
                      params: rulesetName
        "401":
          description: Unauthorized — authentication credentials are missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — caller lacks ruleset management permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficientPrivileges:
                  summary: Insufficient privileges
                  value:
                    status: 403
                    code: "1900"
                    message: "You don't have enough privileges to perform this operation"
        "409":
          description: Conflict — a ruleset with the same name already exists for the API type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                duplicateName:
                  summary: Duplicate ruleset name
                  value:
                    status: 409
                    code: "2001"
                    message: "Ruleset name $name is not unique for API type $type"
                    params:
                      name: "My Ruleset"
                      type: openapi-3-0
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/rulesets/{id}:
    delete:
      tags:
        - Ruleset Management
      summary: Delete a ruleset
      description: >
        Deletes a ruleset. A ruleset can be deleted only if it is inactive and no API package versions
        have been validated against it. Returns `400 Bad Request` if deletion preconditions are not met.
        This operation is available only to users with the `system administrator` role.
      operationId: deleteRuleset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique ruleset identifier (UUID).
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        "204":
          description: >
            No Content — the ruleset was deleted successfully. The response has no body.
        "400":
          description: >
            Bad Request — deletion preconditions are not met (ruleset is active, was previously activated,
            or has validation history). Returns `ErrorResponse` with code `2000` (`RulesetCanNotBeDeleted`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >
            Unauthorized — authentication credentials are missing or invalid. Returns `ErrorResponse`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            Forbidden — the caller lacks the system administrator role. Returns `ErrorResponse` with code
            `1900` (`InsufficientPrivileges`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: >
            Internal Server Error — an unexpected failure occurred during deletion. Returns `ErrorResponse`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/rulesets/{id}/activation:
    post:
      tags:
        - Ruleset Management
      summary: Activate a ruleset
      description: >
        Activate an inactive ruleset. Currently active ruleset is automatically deactivated after new ruleset is activated.
        This operation is available only to users with the `system administrator` role.
      operationId: postRulesetsActivate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique ruleset identifier (UUID).
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        "204":
          description: Success
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/debug/logs/checkLevel:
    get:
      tags:
        - Debug
      summary: Check log level
      description: >
        Returns the current service-wide log level. As a side effect, emits sample log entries at error,
        warn, info, debug, and trace severities to verify logging output; each call may increase log volume
        in monitoring systems.
      operationId: checkLogLevel
      responses:
        "200":
          description: Current service-wide log level as plain text.
          content:
            text/plain:
              schema:
                type: string
                description: >
                  Lowercase logrus level name embedded in a plain-text status message. Allowed level values
                  are panic, fatal, error, warn, info, debug, and trace.
                example: "Current log level is 'info'. See logs for details"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/debug/logs/setLevel:
    post:
      tags:
        - Debug
      summary: Set log level
      description: >
        Sets the service-wide log level for the running process. The change takes effect immediately,
        applies globally to all components, and does not persist across service restarts. Accepted level
        values are defined in the request body schema.
      operationId: setLogLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - level
              properties:
                level:
                  type: string
                  description: >
                    Service-wide log level to apply immediately for the running process. The setting is not
                    persisted across restarts.
                  enum:
                    - panic
                    - fatal
                    - error
                    - warn
                    - info
                    - debug
                    - trace
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request — invalid JSON body or unrecognized level value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ErrorResponse:
      description: >
        Standard error payload returned for failed requests. Use code for programmatic handling. When params
        is present, message contains unsubstituted $key placeholders; clients must perform substitution
        before display (see message and params property descriptions).
      type: object
      example:
        status: 400
        code: "15"
        message: "Required parameters are missing: $params"
        params:
          params: rulesetName
      required:
        - status
        - code
        - message
      properties:
        status:
          description: HTTP status code as an integer; expected to match the actual HTTP response status.
          type: integer
        code:
          description: >
            Internal numeric string error code for programmatic handling (for example, `15`, `1900`, `2000`).
            The `message` field may contain `$`-prefixed placeholders that correspond to keys in `params`.
          type: string
          example: "1900"
        message:
          description: >
            Human-readable error message in English. The server returns the message template as-is; it does
            not substitute placeholders. When params is present, replace each $key in this field with the
            corresponding value from params before displaying the message to users.
          type: string
          example: "Required parameters are missing: $params"
        params:
          type: object
          description: >
            Optional key-value map of parameters used to populate `$key` placeholders in `message`
            (for example, `{ "params": "rulesetName" }` or `{ "name": "My Ruleset", "type": "openapi-3-0" }`).
            Values are typically strings or numbers.
          example:
            params: rulesetName
        debug:
          description: >
            Optional technical details for troubleshooting (for example, parse errors or internal exception
            messages). Present when the server attaches diagnostic information, often on `400 Bad Request`.
            May contain sensitive data or internal identifiers; do not display to end users or persist in
            client logs without appropriate access controls.
          type: string
    Ruleset:
      description: >
        Representation of a validation ruleset and its metadata, including identifier, name, file name,
        status, target API type, linter, creation timestamp, and whether it can be deleted.
      type: object
      required:
        - id
        - name
        - fileName
        - status
        - apiType
        - linter
        - createdAt
        - canBeDeleted
      properties:
        id:
          type: string
          description: Unique identifier of the ruleset.
        name:
          type: string
          description: Unique name of the ruleset.
          example: "OpenAPI Quality Ruleset"
        fileName:
          type: string
          description: Ruleset file name.
          example: "R2025Ruleset.yaml"
        status:
          description: >
            Lifecycle state of the ruleset. active means the ruleset is currently applied during API
            specification validation for its apiType and linter; inactive means it is stored but not used
            for validation until activated.
          type: string
          enum:
            - active
            - inactive
        apiType:
          description: API type that this ruleset targets (for example, openapi-3-0 or asyncapi-3-0).
          type: string
          enum:
            - openapi-2-0
            - openapi-3-0
            - openapi-3-1
            - asyncapi-3-0
        linter:
          description: Name of the linter that this ruleset is suitable for.
          type: string
          enum:
            - spectral
            - ai_linter
        createdAt:
          description: Ruleset creation timestamp in ISO 8601 format (UTC).
          type: string
          format: date-time
          example: "2025-05-30T12:00:00Z"
        canBeDeleted:
          description: >
            Indicates whether the ruleset can be deleted. Returns `true` only when the ruleset is inactive
            and no API package versions have been validated against it; otherwise `false`.
          type: boolean
          example: true
    RulesetCreate:
      description: >
        Multipart form fields for creating a new ruleset. All listed properties are required. The uploaded
        file format depends on the selected linter.
      type: object
      required:
        - rulesetName
        - apiType
        - linter
        - rulesetFile
      properties:
        rulesetName:
          description: >
            Unique name of the ruleset within the selected API type. Duplicate names for the same API type
            return `409 Conflict`.
          type: string
          example: "New Ruleset"
        apiType:
          description: API type that this ruleset targets (for example, openapi-3-0 or asyncapi-3-0).
          type: string
          enum:
            - openapi-2-0
            - openapi-3-0
            - openapi-3-1
            - asyncapi-3-0
        linter:
          description: Target linter for this ruleset.
          type: string
          enum:
            - spectral
            - ai_linter
        rulesetFile:
          description: >
            Ruleset file to upload. The required format depends on the selected linter: Spectral YAML for
            `spectral`, or AI linter rules YAML for `ai_linter`.
          type: string
          format: binary
  securitySchemes:
    BearerAuth:
      type: http
      description: >
        JWT bearer token authentication. Send the token in the `Authorization` header as
        `Authorization: Bearer <token>`. Any one of the declared security schemes (Bearer token, API key,
        or Personal Access Token) is sufficient; schemes are alternatives, not combined requirements.
        Always use HTTPS in production to protect tokens in transit.
      scheme: bearer
      bearerFormat: JWT
    api-key:
      type: apiKey
      description: >
        API key authentication. Provide the key in the `api-key` request header
        (for example, `api-key: <your-api-key>`).
      name: api-key
      in: header
    PersonalAccessToken:
      type: apiKey
      description: >
        Personal access token authentication for programmatic access. Provide the token in the
        `X-Personal-Access-Token` request header. Intended for long-lived integrations where bearer
        session tokens are not used.
      name: X-Personal-Access-Token
      in: header
