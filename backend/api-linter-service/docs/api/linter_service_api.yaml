openapi: 3.0.3
info:
  title: Linter Service API
  version: "1.0"
  description: The Linter Service API provides a set of operations for validating (linting) the quality of OpenAPI specifications. It enables the retrieval of validation results and ruleset metadata.
servers:
  - url: /
security:
  - BearerAuth: []
  - api-key: []
  - PersonalAccessToken: []
tags:
  - name: Linters
    description: API for retrieving available linter configurations.
  - name: Ruleset Management
    description: API related to management of validation rulesets.
  - name: Validation Result
    description: API for retrieving Spectral validation results for package versions.
  - name: Validation Operations
    description: API operations for managing validation processes.
paths:
  /api/v1/linters:
    get:
      tags:
        - Linters
      summary: List available linters
      description: >
        Returns the list of available linter configurations with their supported API types and enabled status.
        Configuration is derived from system settings (e.g., AI OAS linter visibility depends on ENABLE_AI_OAS_LINTER).
      operationId: listLinters
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalLinterConfig"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/rulesets/{id}:
    get:
      tags:
        - Ruleset Management
      summary: Get ruleset metadata
      description: >
        Returns the ruleset name, status, and activation history.
        This operation requires read permission.
      operationId: getRulesetById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique ruleset ID
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruleset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/rulesets/{id}/activation:
    get:
      tags:
        - Ruleset Management
      summary: Get activation history for a ruleset
      description: >
        Returns the activation history for the specified ruleset.
        Shows periods when the ruleset was activated and deactivated.
        Only the latest 100 activation records are returned.
      operationId: getRulesetActivationHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique ruleset ID
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesetActivationHistory"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/rulesets/{id}/data:
    get:
      tags:
        - Ruleset Management
      summary: Download Spectral ruleset file
      description: >
        Returns the plain YAML content of the ruleset.
      security: []
      operationId: getRulesetDownload
      parameters:
        - name: id
          in: path
          description: Unique ruleset ID
          required: true
          schema:
            type: string
        - name: disposition
          in: query
          description: >
            Controls the content disposition of the response.
            Use `inline` to display in browser, or `attachment` to trigger download locally.
          schema:
            type: string
            enum:
              - inline
              - attachment
            default: inline
      responses:
        "200":
          description: Success
          content:
            application/yaml:
              schema:
                type: string
                description: YAML content of Spectral ruleset file.
          headers:
            Content-Disposition:
              schema:
                type: string
                description: Header is required if inlineContent = false. When present, must have "attachment" and "fileName" parameters.
                example: attachment; filename="<file name>.yaml"
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
                example: nosniff
                description: Prevents MIME-type sniffing.
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/packages/{packageId}/versions/{version}/validation/summary:
    get:
      tags:
        - Validation Result
      summary: Get validation summary for a package version (v1)
      description: >
        Returns a summary of the validation status for the specified package version,
        including the ruleset used and issue counts grouped by severity.
        If the package version contains multiple documents, the returned summary is aggregated across all validated documents.
        **Deprecated:** Use v2 endpoint for multi-linter support.
      operationId: getPackageVersionValidationSummary
      deprecated: true
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationSummary"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/packages/{packageId}/versions/{version}/validation/summary:
    get:
      tags:
        - Validation Result
      summary: Get validation summary for a package version
      description: >
        Returns a summary of the validation status for the specified package version,
        including the rulesets used and issue counts grouped by severity.
        Supports multiple linters (Spectral, AI OAS) per document.
      operationId: getPackageVersionValidationSummaryV2
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationSummary"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/packages/{packageId}/versions/{version}/validation:
    post:
      tags:
        - Validation Operations
      summary: Run manual validation for a package version
      description: >
        Manually run validation for a specific package version.
        This is used when linter service was deployed after version publication.
        This operation is available only to users with publication rights.
      operationId: runPackageVersionValidation
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: string
          description: Unique package identifier
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: Package version
        - name: recalculate
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            When true, bypasses the lint cache and forces fresh validation.
            Use `true` to enable. Omit or use `false` to use cached results when available.
      responses:
        "202":
          description: Validation started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Validation started successfully"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Package version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/packages/{packageId}/versions/{version}/validation/documents/{slug}/details:
    get:
      tags:
        - Validation Result
      summary: Get validation details for a specific document (v1)
      description: >
        Returns detailed validation results for a specific document within the package version, including the list of issues and severity levels.
        **Deprecated:** Use v2 endpoint for multi-linter support.

        Sorting of validation issues:
        1. By severity: "error" -> "warning" -> "info".
        2. Within the same severity by document position from start to end.
      operationId: getPackageVersionValidationDocumentsDetails
      deprecated: true
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationDetails"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/packages/{packageId}/versions/{version}/validation/documents/{slug}/details:
    get:
      tags:
        - Validation Result
      summary: Get validation details for a specific document
      description: >
        Returns detailed validation results for a specific document within the package version.
        Supports multiple linters (Spectral, AI OAS) - each linter result includes its ruleset and issues.

        Sorting of validation issues:
        1. By severity: "error" -> "warning" -> "info".
        2. Within the same severity by document position from start to end.
      operationId: getPackageVersionValidationDocumentsDetailsV2
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentValidationDetails"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ExternalLinterConfig:
      description: Configuration of an available linter.
      type: object
      required:
        - linter
        - apiTypes
        - displayName
        - enabled
      properties:
        linter:
          description: Linter identifier.
          type: string
          enum:
            - spectral
            - ai_linter
        apiTypes:
          description: API specification types supported by this linter.
          type: array
          items:
            type: string
            enum:
              - openapi-2-0
              - openapi-3-0
              - openapi-3-1
              - asyncapi-3-0
        displayName:
          description: Human-readable name of the linter.
          type: string
        enabled:
          description: Whether the linter is enabled in the current configuration.
          type: boolean
    ErrorResponse:
      description: An error description
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          description: HTTP Status Code
          type: integer
        code:
          description: Internal string error code. Mandatory in response.
          type: string
        message:
          description: The attribute contains an error message.
          type: string
        params:
          type: object
          description: Optional message parameters
        debug:
          description: Debug details
          type: string
    Ruleset:
      description: Ruleset's parameters
      type: object
      required:
        - id
        - name
        - fileName
        - status
        - apiType
        - linter
        - createdAt
        - canBeDeleted
      properties:
        id:
          type: string
          description: Unique identifier of the ruleset.
        name:
          type: string
          description: Unique name of the ruleset.
          example: "OpenAPI Quality Ruleset"
        fileName:
          type: string
          description: Filename of the ruleset file.
          example: "R2025Ruleset.yaml"
        status:
          description: Status of the ruleset.
          type: string
          enum:
            - active
            - inactive
        apiType:
          description: API type which is going to be checked against the ruleset.
          type: string
          enum:
            - openapi-2-0
            - openapi-3-0
            - openapi-3-1
            - asyncapi-3-0
        linter:
          description: Name of the linter for which this ruleset suitable to.
          type: string
          enum:
            - spectral
            - ai_linter
        createdAt:
          description: Date of ruleset creation.
          type: string
          format: date-time
        canBeDeleted:
          description: |
            Indicates whether the ruleset can be deleted:
              - canBeDeleted = true - if both of the following conditins are met:
                  - ruleset is in inactive status
                  - there is no existing version revision that was validated against current ruleset.
          type: boolean
          example: true
    RulesetActivationHistory:
      description: Activation history for a ruleset
      type: object
      required:
        - id
        - activationHistory
      properties:
        id:
          type: string
          description: Unique identifier of the ruleset
        activationHistory:
          description: |
            Information about periods when ruleset was activated/deactivated.
            If empty, means that ruleset was never activated.
            Only the latest 100 activation records are returned.
          type: array
          items:
            type: object
            required:
              - activeFrom
            properties:
              activeFrom:
                description: Date when ruleset was activated.
                type: string
                format: date-time
              activeTo:
                description: Date when ruleset was deactivated. Null if currently active.
                type: string
                format: date-time
                nullable: true
    RulesetMetadata:
      description: Metadata about the ruleset used for validation.
      type: object
      required:
        - id
        - name
        - fileName
        - status
      properties:
        id:
          description: Unique identifier of the ruleset.
          type: string
        name:
          description: Name of the ruleset.
          type: string
        fileName:
          type: string
          description: Filename of the ruleset file.
          example: "R2025Ruleset.yaml"
        status:
          description: Current status of the ruleset.
          type: string
          enum:
            - active
            - inactive
    ValidationSummary:
      description: Aggregated validation summary for a package version.
      type: object
      required:
        - status
      properties:
        status:
          description: Current validation status for the package version.
          type: string
          enum:
            - success
            - inProgress
            - notValidated
            - error
        documents:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                enum:
                  - success
                  - error
              details:
                type: string
              slug:
                type: string
              apiType:
                description: Type of the API specification.
                type: string
                enum:
                  - openapi-2-0
                  - openapi-3-0
                  - openapi-3-1
                  - asyncapi-3-0
              documentName:
                type: string
              rulesetId:
                type: string
              issuesSummary:
                type: object
                properties:
                  error:
                    type: integer
                  warning:
                    type: integer
                  info:
                    type: integer
                  hint:
                    type: integer
                required:
                  - error
                  - warning
                  - info
                  - hint
            required:
              - status
              - slug
              - apiType
              - documentName
              - rulesetId
        rulesets:
          type: array
          items:
            $ref: "#/components/schemas/Ruleset"
    ValidatedDocument:
      description: Metadata about the validated document.
      type: object
      required:
        - slug
        - specificationType
        - documentName
      properties:
        slug:
          description: Unique identifier of the document in a slug format.
          type: string
        specificationType:
          description: Type of the specification notation.
          type: string
          enum:
            - openapi-3-1
            - openapi-3-0
            - openapi-2-0
            - asyncapi-3-0
        documentName:
          description: Display name of the document.
          type: string
    ValidationDetails:
      description: Validation details for one document under one ruleset.
      type: object
      required:
        - ruleset
        - issues
        - document
      properties:
        ruleset:
          $ref: "#/components/schemas/RulesetMetadata"
        issues:
          description: List of individual validation issues in the document.
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        document:
          $ref: "#/components/schemas/ValidatedDocument"
    DocumentValidationDetails:
      description: Validation details for a document with results from multiple linters (v2).
      type: object
      required:
        - document
        - results
      properties:
        document:
          $ref: "#/components/schemas/ValidatedDocument"
        results:
          description: Validation results from each linter (Spectral, AI OAS, etc.).
          type: array
          items:
            $ref: "#/components/schemas/LinterResult"
    LinterResult:
      description: Validation result from a single linter.
      type: object
      required:
        - linter
        - ruleset
        - issues
      properties:
        linter:
          description: Name of the linter that produced this result.
          type: string
          enum:
            - spectral
            - ai_linter
        ruleset:
          $ref: "#/components/schemas/RulesetMetadata"
        issues:
          description: List of validation issues found by this linter.
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    ValidationIssue:
      description: A single validation issue.
      type: object
      required:
        - path
        - severity
        - message
        - code
      properties:
        path:
          description: Path segments pointing to the issue location in the document.
          type: array
          items:
            type: string
        code:
          description: Id of the rule that identified the issue.
          type: string
        severity:
          type: string
          enum:
            - error
            - warning
            - info
        message:
          description: Description of the validation issue.
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      description: Bearer token authentication. Default security scheme for API usage.
      scheme: bearer
      bearerFormat: JWT
    api-key:
      type: apiKey
      description: Api-key authentication.
      name: api-key
      in: header
    PersonalAccessToken:
      type: apiKey
      description: Authentication by personal access token.
      name: X-Personal-Access-Token
      in: header
